<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Active Ingredients Explorer</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&family=Avenir:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --primary-color: #7c3aed;
      --secondary-color: #5b21b6;
      --background-color: #f5f3ff;
      --card-background: #ffffff;
      --text-primary: #1e1b4b;
      --text-secondary: #4c1d95;
      --border-color: #e9d8fd;
      --hover-color: #f3e8ff;
      --shadow-sm: 0 1px 2px 0 rgb(124, 58, 237, 0.05);
      --shadow-md: 0 4px 6px -1px rgb(124, 58, 237, 0.1);
      --radius-sm: 0.375rem;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Avenir", sans-serif;
      background-color: var(--background-color);
      color: var(--text-primary);
      line-height: 1.5;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    .app-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 100vh;
      overflow: hidden;
    }

    .left-panel {
      padding: 2rem;
      overflow-y: auto;
      border-right: 1px solid var(--border-color);
      background-color: var(--background-color);
    }

    .right-panel {
      padding: 2rem;
      overflow-y: auto;
      background-color: var(--card-background);
    }

    .ingredient-title {
      color: var(--primary-color);
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .ingredient-description {
      font-size: 1.1rem;
      color: var(--text-secondary);
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .section {
      margin-bottom: 2rem;
      padding: 1.5rem;
      background-color: var(--background-color);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
    }

    .section h2 {
      color: var(--primary-color);
      margin-bottom: 1rem;
      font-size: 1.5rem;
    }

    .accordion {
      margin-bottom: 1rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .accordion-header {
      padding: 1rem;
      background-color: var(--card-background);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      -webkit-user-select: none;
      user-select: none;
    }

    .accordion-header:hover {
      background-color: var(--hover-color);
    }

    .accordion-header h3 {
      margin: 0;
      font-size: 1.1rem;
      color: var(--text-primary);
    }

    .accordion-content {
      padding: 1rem;
      display: none;
      background-color: var(--background-color);
      border-top: 1px solid var(--border-color);
    }

    .accordion-content.active {
      display: block;
    }

    .scenario-info {
      margin-top: 1rem;
    }

    .scenario-info h4 {
      color: var(--primary-color);
      margin-bottom: 0.5rem;
    }

    .scenario-info p {
      margin-bottom: 1rem;
      font-size: 0.95rem;
    }

    .no-selection {
      display: flex;
      height: 100%;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 1.2rem;
      text-align: center;
      padding: 2rem;
    }

    .ingredients-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    .ingredient-card {
      background-color: var(--card-background);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .ingredient-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .ingredient-card.selected {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.2);
    }

    .evaluation-summary {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .evaluation-badge {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.25rem 0.75rem;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      font-weight: 500;
      white-space: nowrap;
    }

    .dimension-score {
      font-family: monospace;
      font-size: 0.75rem;
      padding: 0.1rem 0.3rem;
      background: rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-sm);
      min-width: 2.5rem;
      text-align: center;
    }

    .rating-1 {
      background-color: rgba(16, 185, 129, 0.15);
      color: rgb(6, 95, 70);
    }

    .rating-0 {
      background-color: rgba(245, 158, 11, 0.15);
      color: rgb(146, 64, 14);
    }

    .rating--1 {
      background-color: rgba(239, 68, 68, 0.15);
      color: rgb(153, 27, 27);
    }

    .interestingness-score {
      display: inline-block;
      padding: 0.3rem 0.6rem;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 600;
      background-color: rgba(59, 130, 246, 0.1);
      color: #1e40af;
      border: 1px solid rgba(59, 130, 246, 0.2);
    }

    .details-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 40%;
      height: 100vh;
      background-color: var(--card-background);
      padding: 2rem;
      overflow-y: auto;
      box-shadow: -4px 0 6px -1px rgba(0, 0, 0, 0.1);
      transform: translateX(100%);
      transition: transform 0.3s ease;
      z-index: 1000;
    }

    .details-panel.active {
      transform: translateX(0);
    }

    .details-panel h2 {
      color: var(--primary-color);
      margin-bottom: 1rem;
    }

    .details-panel h3 {
      color: var(--text-primary);
      margin: 1.5rem 0 0.75rem;
    }

    .dimension-item {
      margin-bottom: 1.5rem;
      padding: 1rem;
      background-color: var(--background-color);
      border-radius: var(--radius-md);
    }

    .dimension-item h4 {
      color: var(--primary-color);
      margin-bottom: 0.75rem;
    }

    .question-item {
      margin-bottom: 0.75rem;
      padding: 0.75rem;
      background-color: var(--card-background);
      border-radius: var(--radius-sm);
      border-left: 3px solid var(--border-color);
    }

    .close-button {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 1.5rem;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.1);
      display: none;
      z-index: 999;
      cursor: pointer;
    }

    .overlay.active {
      display: block;
    }

    .filters {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 2rem;
      padding: 1.5rem;
      background-color: var(--card-background);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }

    .filter-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .filter-group label {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .filter-input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      transition: all 0.2s;
      background-color: var(--background-color);
      font-family: "Avenir", sans-serif;
    }

    .filter-input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
    }

    .filter-input::placeholder {
      color: var(--text-secondary);
      opacity: 0.6;
    }

    .ingredient-content {
      margin-bottom: 1.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-color);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Left Panel -->
    <div class="left-panel">
      <h1>Active Ingredients Explorer</h1>
      <div class="filters">
        <div class="filter-group">
          <label for="searchInput">Search Ingredients</label>
          <input type="text" id="searchInput" class="filter-input" placeholder="Search by text...">
        </div>
        <div class="filter-group">
          <label for="interestingnessFilter">Interestingness Score</label>
          <select id="interestingnessFilter" class="filter-input">
            <option value="">All Scores</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
        </div>
      </div>
      <div class="ingredients-grid" id="ingredientsGrid"></div>
    </div>

    <!-- Right Panel -->
    <div class="right-panel" id="detailsPanel">
      <div class="no-selection" id="noSelection">
        Select an active ingredient to view details
      </div>
      <div id="detailsContent" style="display: none;"></div>
    </div>
  </div>

  <!-- Load external data file -->
  <script src="data/active_ingredients.js"></script>

  <script>
    let ingredientsList = [];
    let selectedIngredient = null;

    function formatIngredientTitle(text) {
      // First try to match markdown formatted text
      let match = text.match(/\*\*(.*?):\*\*(.*)/);
      
      // If no markdown match, try to split on the first colon
      if (!match) {
        const colonIndex = text.indexOf(':');
        if (colonIndex !== -1) {
          return {
            title: text.substring(0, colonIndex).trim(),
            description: text.substring(colonIndex + 1).trim()
          };
        }
      } else {
        return {
          title: match[1],
          description: match[2].trim()
        };
      }
      
      // If no colon found, return entire text as title
      return {
        title: text,
        description: ''
      };
    }

    function toggleAccordion(header) {
      const content = header.nextElementSibling;
      const isActive = content.classList.contains('active');
      
      // Close all accordions
      document.querySelectorAll('.accordion-content').forEach(item => {
        item.classList.remove('active');
      });
      
      // Toggle clicked accordion
      if (!isActive) {
        content.classList.add('active');
      }
    }

    function showDetails(uuid) {
      const ingredient = ingredientsList.find(i => i.active_ingredient_uuid === uuid);
      if (!ingredient) return;

      selectedIngredient = uuid;
      const detailsContent = document.getElementById('detailsContent');
      const noSelection = document.getElementById('noSelection');
      
      noSelection.style.display = 'none';
      detailsContent.style.display = 'block';

      const { title, description } = formatIngredientTitle(ingredient.active_ingredient_text);

      detailsContent.innerHTML = `
        <div class="ingredient-title">${formatMarkdown(title)}</div>
        <div class="ingredient-description">${formatMarkdown(description)}</div>

        <div class="section">
          <h2>Evaluation</h2>
          ${ingredient.evaluation.dimensions.map(dimension => `
            <div class="accordion">
              <div class="accordion-header" onclick="toggleAccordion(this)">
                <h3>${dimension.dimension_name}</h3>
                <div class="dimension-score ${getScoreColorClass(dimension.questions)}">
                  ${getDimensionScore(dimension.questions)}
                </div>
              </div>
              <div class="accordion-content">
                ${dimension.questions.map(question => `
                  <div class="question-item">
                    <div class="question-text">${formatMarkdown(question.question)}</div>
                    <div class="evaluation-badge rating-${question.rating}">${question.rating}</div>
                    <div class="rationale">${formatMarkdown(question.rationale)}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          `).join('')}

          <div class="accordion">
            <div class="accordion-header" onclick="toggleAccordion(this)">
              <h3>Overall Summary</h3>
            </div>
            <div class="accordion-content">
              <p>${formatMarkdown(ingredient.evaluation.overall_summary)}</p>
            </div>
          </div>

          <div class="accordion">
            <div class="accordion-header" onclick="toggleAccordion(this)">
              <h3>Interestingness (Score: ${ingredient.evaluation.interestingness.score})</h3>
            </div>
            <div class="accordion-content">
              <p>${formatMarkdown(ingredient.evaluation.interestingness.rationale)}</p>
            </div>
          </div>
        </div>

        <div class="section">
          <h2>Scenario Information</h2>
          <div class="scenario-info">
            <h4>${formatMarkdown(ingredient.scenario.scenario_name)}</h4>
            <p>${formatMarkdown(ingredient.scenario.scenario_description)}</p>
            
            <h4>Alignment with Structure</h4>
            <p>${formatMarkdown(ingredient.scenario.alignment_with_structure)}</p>
            
            <h4>Design Problem Connection</h4>
            <p>${formatMarkdown(ingredient.scenario.design_problem_connection)}</p>
          </div>
        </div>
      `;

      renderIngredients(ingredientsList);
    }

    // Function to format markdown text
    function formatMarkdown(text) {
      if (!text) return '';
      text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      text = text.replace(/\n/g, '<br>');
      return text;
    }

    // Function to calculate dimension score
    function getDimensionScore(questions) {
      const sum = questions.reduce((acc, q) => acc + q.rating, 0);
      const total = questions.length;
      return `${sum}/${total * 1}`; // multiply by 1 since ratings are -1, 0, 1
    }

    // Function to get color class based on score
    function getScoreColorClass(questions) {
      const sum = questions.reduce((acc, q) => acc + q.rating, 0);
      const total = questions.length;
      const ratio = sum / (total * 1); // multiply by 1 since ratings are -1, 0, 1
      
      if (ratio >= 0.5) return 'rating-1';
      if (ratio > -0.3) return 'rating-0';
      return 'rating--1';
    }

    // Function to filter ingredients
    function filterIngredients() {
      const searchText = document.getElementById('searchInput').value.toLowerCase();
      const interestingnessScore = document.getElementById('interestingnessFilter').value;

      const filtered = ingredientsList.filter(ingredient => {
        // Check if ingredient is valid
        if (!isValidIngredient(ingredient)) {
          return false;
        }

        const matchesSearch = ingredient.active_ingredient_text.toLowerCase().includes(searchText);
        
        // Safely check interestingness score
        const ingredientScore = ingredient.evaluation?.interestingness?.score;
        const matchesScore = !interestingnessScore || 
          (ingredientScore !== undefined && ingredientScore.toString() === interestingnessScore);

        return matchesSearch && matchesScore;
      });

      renderIngredients(filtered);
    }

    // Function to validate an ingredient's structure
    function isValidIngredient(ingredient) {
      if (!ingredient || typeof ingredient !== 'object') {
        console.warn('Invalid ingredient: Not an object', ingredient);
        return false;
      }

      // Check required top-level properties
      const hasRequiredProps = 
        typeof ingredient.active_ingredient_uuid === 'string' &&
        typeof ingredient.active_ingredient_text === 'string' &&
        typeof ingredient.evaluation === 'object' &&
        typeof ingredient.scenario === 'object';

      if (!hasRequiredProps) {
        console.warn('Invalid ingredient: Missing required properties', {
          uuid: typeof ingredient.active_ingredient_uuid,
          text: typeof ingredient.active_ingredient_text,
          evaluation: typeof ingredient.evaluation,
          scenario: typeof ingredient.scenario
        });
        return false;
      }

      // Check evaluation structure
      const evaluation = ingredient.evaluation;
      const hasValidEvaluation = 
        Array.isArray(evaluation.dimensions) &&
        typeof evaluation.interestingness === 'object' &&
        typeof evaluation.interestingness.score === 'number' &&
        typeof evaluation.interestingness.rationale === 'string' &&
        typeof evaluation.overall_summary === 'string';

      if (!hasValidEvaluation) {
        console.warn('Invalid ingredient: Invalid evaluation structure', {
          dimensions: Array.isArray(evaluation.dimensions),
          interestingness: typeof evaluation.interestingness,
          score: typeof evaluation.interestingness?.score,
          rationale: typeof evaluation.interestingness?.rationale,
          summary: typeof evaluation.overall_summary
        });
        return false;
      }

      // Check scenario structure
      const scenario = ingredient.scenario;
      const hasValidScenario = 
        typeof scenario.scenario_name === 'string' &&
        typeof scenario.scenario_description === 'string' &&
        typeof scenario.alignment_with_structure === 'string' &&
        typeof scenario.design_problem_connection === 'string';

      if (!hasValidScenario) {
        console.warn('Invalid ingredient: Invalid scenario structure', {
          name: typeof scenario.scenario_name,
          description: typeof scenario.scenario_description,
          alignment: typeof scenario.alignment_with_structure,
          connection: typeof scenario.design_problem_connection
        });
        return false;
      }

      return true;
    }

    // Function to render ingredient cards
    function renderIngredients(ingredients) {
      const grid = document.getElementById('ingredientsGrid');
      
      const validIngredients = ingredients.filter(ingredient => {
        if (!isValidIngredient(ingredient)) {
          console.warn('Invalid ingredient structure:', ingredient);
          return false;
        }
        return true;
      });

      console.log(`Rendering ${validIngredients.length} valid ingredients out of ${ingredients.length} total`);

      grid.innerHTML = validIngredients.map(ingredient => `
        <div class="ingredient-card ${selectedIngredient === ingredient.active_ingredient_uuid ? 'selected' : ''}"
             onclick="showDetails('${ingredient.active_ingredient_uuid}')">
          <div class="ingredient-content">
            ${formatMarkdown(ingredient.active_ingredient_text)}
          </div>
          <div class="evaluation-summary">
            ${ingredient.evaluation.dimensions.map(dimension => `
              <div class="evaluation-badge ${getScoreColorClass(dimension.questions)}">
                ${dimension.dimension_name}
                <span class="dimension-score">${getDimensionScore(dimension.questions)}</span>
              </div>
            `).join('')}
          </div>
          <div class="interestingness-score">
            Interestingness: ${ingredient.evaluation.interestingness.score}
          </div>
        </div>
      `).join('');
    }

    // Add event listeners for filters
    document.getElementById('searchInput').addEventListener('input', filterIngredients);
    document.getElementById('interestingnessFilter').addEventListener('change', filterIngredients);

    // Initialize with the data from the external file
    window.addEventListener('DOMContentLoaded', () => {
      try {
        // Check if the data is available
        if (typeof activeIngredients === 'undefined') {
          console.error('activeIngredients is not defined. Check the data file format.');
          return;
        }
        
        // Log the data to verify it's loaded correctly
        console.log('Loaded active ingredients:', activeIngredients);
        
        // Ensure we have an array
        if (!Array.isArray(activeIngredients)) {
          console.error('activeIngredients is not an array. Check the data file format.');
          return;
        }

        // Log the first few items to check their structure
        console.log('First few ingredients:', activeIngredients.slice(0, 3));
        
        ingredientsList = activeIngredients;
        renderIngredients(ingredientsList);

        // Add click handler to overlay if it exists
        const overlay = document.getElementById('overlay');
        if (overlay) {
          overlay.addEventListener('click', closeDetails);
        }
      } catch (error) {
        console.error('Error loading active ingredients:', error);
      }
    });
  </script>
</body>
</html>
