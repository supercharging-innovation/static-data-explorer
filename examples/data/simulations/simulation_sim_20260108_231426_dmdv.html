<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial Vitrimer Gasket Simulator</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f1115; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #e0e0e0; }
        canvas { display: block; }
        
        /* UI Overlay */
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 320px;
            background: rgba(15, 17, 21, 0.9);
            border: 1px solid #333;
            border-left: 4px solid #00d2ff;
            padding: 20px;
            border-radius: 4px;
            pointer-events: none; /* Allow clicks to pass through to canvas generally */
            user-select: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        #controls {
            pointer-events: auto; /* Re-enable clicks for buttons */
        }

        h1 { margin: 0 0 10px 0; font-size: 1.2rem; color: #00d2ff; text-transform: uppercase; letter-spacing: 1px; }
        h2 { margin: 0 0 5px 0; font-size: 0.9rem; color: #aaa; }
        p { font-size: 0.85rem; line-height: 1.4; color: #ccc; margin-bottom: 15px; }

        .control-group { margin-bottom: 15px; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 4px; }
        
        label { display: block; font-size: 0.8rem; margin-bottom: 5px; font-weight: bold; color: #fff; }
        
        /* Sliders and Buttons */
        input[type=range] { width: 100%; cursor: pointer; accent-color: #ff4d4d; }
        
        button {
            background: #2a2d35;
            color: white;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
            width: 100%;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-weight: bold;
        }

        button:hover { background: #3a3f4b; border-color: #00d2ff; }
        button.active { background: #00d2ff; color: #000; border-color: #00d2ff; }
        button.action-btn { background: linear-gradient(90deg, #ff8c00, #ff4d4d); border: none; margin-top: 5px; }
        button.action-btn:hover { opacity: 0.9; }
        button.action-btn:active { transform: scale(0.98); }

        /* Status Indicators */
        .status-row { display: flex; justify-content: space-between; font-size: 0.8rem; margin-top: 5px; border-top: 1px solid #333; padding-top: 10px;}
        .status-item { text-align: center; }
        .status-val { font-weight: bold; font-size: 1.1rem; display: block; }
        .hot { color: #ff4d4d; }
        .cold { color: #00d2ff; }

        /* Legend */
        .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; font-size: 0.75rem; }
        .legend-item { display: flex; align-items: center; }
        .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
        
        /* Floating Labels */
        .label-marker {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
            border: 1px solid #555;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #tooltip {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px;
            max-width: 300px;
            border-radius: 8px;
            border-left: 4px solid #ff8c00;
            font-size: 0.9rem;
            display: none;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui-container">
        <h1>Vitrimer Gasket Tech</h1>
        <p>Interactive simulation of Associative Bond Exchange (Transesterification).</p>
        
        <div id="controls">
            <div class="control-group">
                <label>Temperature (Activation)</label>
                <input type="range" id="tempSlider" min="0" max="100" value="0">
                <div class="status-row">
                    <div class="status-item">
                        <span class="status-val cold" id="tempDisplay">25°C</span>
                        State
                    </div>
                    <div class="status-item">
                        <span class="status-val" id="materialState" style="color:#00d2ff">SOLID</span>
                        Behavior
                    </div>
                </div>
            </div>

            <div class="control-group">
                <label>Mechanical Stress</label>
                <button id="stressBtn" class="action-btn">Apply Shearing Force</button>
                <p style="font-size: 0.75rem; margin-top:5px; color:#aaa;">Click to pull the material sideways.</p>
            </div>

            <div class="control-group">
                <label>View Options</label>
                <button id="toggleLabels">Toggle Labels</button>
                <button id="resetBtn">Reset Simulation</button>
            </div>
        </div>

        <div class="legend">
            <div class="legend-item"><div class="dot" style="background: #00d2ff;"></div>Polymer Chain</div>
            <div class="legend-item"><div class="dot" style="background: #ff8c00;"></div>Vitrimer Bond</div>
            <div class="legend-item"><div class="dot" style="background: #555;"></div>Permanent Backbone</div>
        </div>
    </div>

    <div id="tooltip"></div>

    <!-- 3D Labels (populated by JS) -->
    <div id="labels-container"></div>

    <script>
        // --- Configuration ---
        const config = {
            gridRows: 4,
            gridCols: 8,
            spacingX: 3,
            spacingY: 2.5,
            activationTemp: 60, // Slider value threshold
            colors: {
                bg: 0x0f1115,
                atom: 0x0088ff,
                atomHot: 0xff4444,
                bondPermanent: 0x555555,
                bondVitrimer: 0xff8c00,
                bondActive: 0xffff00
            }
        };

        // --- State ---
        let state = {
            temperature: 0, // 0 to 100
            isStressed: false,
            stressFactor: 0, // 0 to 1 for animation
            activeSwaps: [], // Array of swapping animations
            labelsVisible: true
        };

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(config.colors.bg);
        scene.fog = new THREE.Fog(config.colors.bg, 10, 50);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0x00d2ff, 0.5);
        pointLight.position.set(-10, 5, 5);
        scene.add(pointLight);

        // --- Objects ---
        const atoms = [];
        const permanentBonds = [];
        const vitrimerBonds = [];
        const atomGeo = new THREE.SphereGeometry(0.5, 32, 32);
        const atomMat = new THREE.MeshStandardMaterial({ color: config.colors.atom, roughness: 0.3, metalness: 0.7 });
        
        // Group to hold the entire grid for centering
        const networkGroup = new THREE.Group();
        scene.add(networkGroup);

        // Helper to create line
        function createLine(p1, p2, color, thickness = 1) {
            // Using cylinders for thicker visible lines
            const vec = new THREE.Vector3().subVectors(p2, p1);
            const height = vec.length();
            const geo = new THREE.CylinderGeometry(thickness * 0.1, thickness * 0.1, height, 8);
            geo.translate(0, height / 2, 0);
            geo.rotateX(Math.PI / 2);
            
            const mat = new THREE.MeshStandardMaterial({ 
                color: color, 
                emissive: color, 
                emissiveIntensity: 0.2 
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(p1);
            mesh.lookAt(p2);
            
            // Store reference data
            mesh.userData = {
                start: p1,
                end: p2,
                originalLength: height
            };
            
            return mesh;
        }

        // --- Initialization ---
        function initNetwork() {
            // Clear existing
            while(networkGroup.children.length > 0){ 
                networkGroup.remove(networkGroup.children[0]); 
            }
            atoms.length = 0;
            permanentBonds.length = 0;
            vitrimerBonds.length = 0;

            // Create Grid
            const offsetX = (config.gridCols * config.spacingX) / 2;
            const offsetY = (config.gridRows * config.spacingY) / 2;

            for (let r = 0; r < config.gridRows; r++) {
                for (let c = 0; c < config.gridCols; c++) {
                    const x = c * config.spacingX - offsetX;
                    const y = r * config.spacingY - offsetY;
                    const z = 0;

                    const mesh = new THREE.Mesh(atomGeo, atomMat.clone());
                    mesh.position.set(x, y, z);
                    
                    // Store logic data
                    mesh.userData = {
                        row: r,
                        col: c,
                        basePos: new THREE.Vector3(x, y, z),
                        velocity: new THREE.Vector3()
                    };
                    
                    networkGroup.add(mesh);
                    atoms.push(mesh);

                    // Permanent Backbone (Horizontal)
                    if (c > 0) {
                        const prevAtom = atoms[atoms.length - 2];
                        const bond = createLine(prevAtom.position, mesh.position, config.colors.bondPermanent, 0.8);
                        bond.userData.atomA = prevAtom;
                        bond.userData.atomB = mesh;
                        bond.userData.type = 'permanent';
                        networkGroup.add(bond);
                        permanentBonds.push(bond);
                    }

                    // Vitrimer Bonds (Vertical - sparse)
                    // Create bonds between rows, but not everywhere to allow "swapping" room
                    if (r > 0 && c % 2 === 0) { // Every other column
                        const atomBelow = atoms.find(a => a.userData.row === r - 1 && a.userData.col === c);
                        if (atomBelow) {
                            const bond = createLine(atomBelow.position, mesh.position, config.colors.bondVitrimer, 1.5);
                            bond.userData.atomA = atomBelow; // Bottom
                            bond.userData.atomB = mesh;      // Top
                            bond.userData.type = 'vitrimer';
                            bond.userData.isSwapping = false;
                            networkGroup.add(bond);
                            vitrimerBonds.push(bond);
                        }
                    }
                }
            }
            
            createLabels();
        }

        // --- Labels ---
        function createLabels() {
            const container = document.getElementById('labels-container');
            container.innerHTML = ''; // Clear

            const labels = [
                { text: "Polymer Chain", target: atoms[0].position, offset: {x: -2, y: 0, z:0} },
                { text: "Permanent Backbone", target: permanentBonds[0].position, offset: {x: 0, y: -0.5, z:0} },
                { text: "Vitrimer Crosslink (Exchangeable)", target: vitrimerBonds[Math.floor(vitrimerBonds.length/2)].position, offset: {x: 1, y: 0, z:0} }
            ];

            labels.forEach((l, i) => {
                const div = document.createElement('div');
                div.className = 'label-marker';
                div.textContent = l.text;
                div.id = `label-${i}`;
                container.appendChild(div);
                l.element = div;
            });

            state.sceneLabels = labels;
        }

        function updateLabels() {
            if (!state.labelsVisible) {
                state.sceneLabels.forEach(l => l.element.style.opacity = 0);
                return;
            }

            state.sceneLabels.forEach(l => {
                const pos = l.target.clone().add(new THREE.Vector3(l.offset.x, l.offset.y, l.offset.z));
                // Convert to screen coords
                pos.project(camera);
                
                const x = (pos.x * .5 + .5) * window.innerWidth;
                const y = (-(pos.y * .5) + .5) * window.innerHeight;

                // Check if behind camera
                if (pos.z < 1) {
                    l.element.style.left = `${x}px`;
                    l.element.style.top = `${y}px`;
                    l.element.style.opacity = 1;
                } else {
                    l.element.style.opacity = 0;
                }
            });
        }

        // --- Animation Logic ---

        function updatePhysics() {
            const time = Date.now() * 0.001;
            const tempFactor = state.temperature / 100;
            const vibrationAmt = 0.05 + (tempFactor * 0.15);

            // 1. Move Atoms (Vibration + Stress)
            atoms.forEach(atom => {
                // Base vibration (Brownian motion simulation)
                const noiseX = Math.sin(time * 10 + atom.userData.col) * vibrationAmt;
                const noiseY = Math.cos(time * 12 + atom.userData.row) * vibrationAmt;
                
                // Stress Displacement (Shear)
                // Top rows move right, bottom rows stay or move left
                let stressX = 0;
                if (state.isStressed) {
                    // Simple shear profile: Higher row = more displacement
                    stressX = (atom.userData.row - (config.gridRows/2)) * 2.0 * state.stressFactor;
                }

                // Smoothly interpolate current position to target
                const targetX = atom.userData.basePos.x + stressX + noiseX;
                const targetY = atom.userData.basePos.y + noiseY;
                
                atom.position.x += (targetX - atom.position.x) * 0.1;
                atom.position.y += (targetY - atom.position.y) * 0.1;
                
                // Color update based on temp
                const baseColor = new THREE.Color(config.colors.atom);
                const hotColor = new THREE.Color(config.colors.atomHot);
                atom.material.color.lerpColors(baseColor, hotColor, tempFactor);
            });

            // 2. Update Bonds (Stretch + LookAt)
            [...permanentBonds, ...vitrimerBonds].forEach(bond => {
                if(bond.userData.isSwapping) return; // Handled by swap logic

                const start = bond.userData.atomA.position;
                const end = bond.userData.atomB.position;

                bond.position.copy(start);
                bond.lookAt(end);
                
                const dist = start.distanceTo(end);
                bond.scale.z = dist / bond.userData.originalLength;
            });

            // 3. Vitrimer Logic: Bond Swapping
            if (state.temperature > config.activationTemp) {
                // Chance to initiate a swap
                if (Math.random() < 0.02 * (state.temperature/100) && state.activeSwaps.length < 3) {
                    initiateSwap();
                }
            }

            // 4. Handle Active Swaps
            updateSwaps();
        }

        function initiateSwap() {
            // Pick a random vitrimer bond
            const candidates = vitrimerBonds.filter(b => !b.userData.isSwapping);
            if (candidates.length === 0) return;

            const bond = candidates[Math.floor(Math.random() * candidates.length)];
            
            // Find a new neighbor for the top atom (atomB)
            // Current neighbor is atomA (bottom). 
            // Look for atomA's left or right neighbor in the same row
            const currentRow = bond.userData.atomA.userData.row;
            const currentCol = bond.userData.atomA.userData.col;
            
            // Possible new targets: (col-1) or (col+1) in the same row as the bottom anchor
            const targetCols = [currentCol - 1, currentCol + 1];
            const potentialTargets = atoms.filter(a => 
                a.userData.row === currentRow && 
                targetCols.includes(a.userData.col)
            );

            if (potentialTargets.length > 0) {
                const newTarget = potentialTargets[Math.floor(Math.random() * potentialTargets.length)];
                
                // Start Swap Animation
                state.activeSwaps.push({
                    bond: bond,
                    oldTarget: bond.userData.atomA,
                    newTarget: newTarget,
                    progress: 0,
                    speed: 0.05 + (state.temperature/2000) // Faster if hotter
                });
                
                bond.userData.isSwapping = true;
                bond.material.emissive.setHex(config.colors.bondActive);
                bond.material.color.setHex(config.colors.bondActive);
                
                showTooltip("Bond Exchange Triggered!");
            }
        }

        function updateSwaps() {
            for (let i = state.activeSwaps.length - 1; i >= 0; i--) {
                const swap = state.activeSwaps[i];
                swap.progress += swap.speed;

                const startPos = swap.bond.userData.atomB.position; // The top atom (anchor)
                
                // Interpolate the bottom end of the bond between old target and new target
                const endPos = new THREE.Vector3().lerpVectors(
                    swap.oldTarget.position, 
                    swap.newTarget.position, 
                    swap.progress
                );

                // Update visual bond
                swap.bond.position.copy(endPos); // Cylinder origin is at bottom
                swap.bond.lookAt(startPos);
                const dist = startPos.distanceTo(endPos);
                swap.bond.scale.z = dist / swap.bond.userData.originalLength;

                // Mid-point visual effect (arc)
                // (Simplified here to just linear lerp for robustness)

                if (swap.progress >= 1) {
                    // Swap Complete
                    swap.bond.userData.atomA = swap.newTarget; // Update logical connection
                    swap.bond.userData.isSwapping = false;
                    swap.bond.material.emissive.setHex(config.colors.bondVitrimer);
                    swap.bond.material.color.setHex(config.colors.bondVitrimer);
                    
                    // Remove from active list
                    state.activeSwaps.splice(i, 1);
                }
            }
        }

        // --- Interaction Logic ---
        
        // Stress Animation Loop
        function animateStress() {
            if (state.isStressed) {
                if (state.stressFactor < 1) state.stressFactor += 0.05;
            } else {
                if (state.stressFactor > 0) state.stressFactor -= 0.1; // Snap back faster
            }
        }

        function showTooltip(msg) {
            const el = document.getElementById('tooltip');
            el.innerHTML = `<strong>Event:</strong> ${msg}`;
            el.style.display = 'block';
            el.style.opacity = 1;
            
            // Fade out
            setTimeout(() => {
                el.style.opacity = 0;
                setTimeout(() => el.style.display = 'none', 500);
            }, 1500);
        }

        // --- Main Loop ---
        function animate() {
            requestAnimationFrame(animate);
            
            animateStress();
            updatePhysics();
            updateLabels();
            
            controls.update();
            renderer.render(scene, camera);
        }

        // --- Event Listeners ---
        
        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // UI Controls
        const tempSlider = document.getElementById('tempSlider');
        const tempDisplay = document.getElementById('tempDisplay');
        const materialState = document.getElementById('materialState');
        const stressBtn = document.getElementById('stressBtn');
        const toggleLabelsBtn = document.getElementById('toggleLabels');
        const resetBtn = document.getElementById('resetBtn');

        tempSlider.addEventListener('input', (e) => {
            state.temperature = parseInt(e.target.value);
            
            // Map 0-100 slider to 25C - 200C
            const realTemp = 25 + (state.temperature * 1.75);
            tempDisplay.innerText = `${Math.round(realTemp)}°C`;
            
            if (state.temperature > config.activationTemp) {
                tempDisplay.className = "status-val hot";
                materialState.innerText = "VISCOELASTIC (FLOWING)";
                materialState.style.color = "#ff4d4d";
            } else {
                tempDisplay.className = "status-val cold";
                materialState.innerText = "SOLID (RIGID)";
                materialState.style.color = "#00d2ff";
            }
        });

        stressBtn.addEventListener('mousedown', () => {
            state.isStressed = true;
            stressBtn.classList.add('active');
            
            if (state.temperature < config.activationTemp) {
                showTooltip("Material stretches but holds tension.");
            } else {
                showTooltip("Material flows! Bonds are rearranging.");
            }
        });

        window.addEventListener('mouseup', () => {
            if(state.isStressed) {
                state.isStressed = false;
                stressBtn.classList.remove('active');
                if (state.temperature < config.activationTemp) {
                    showTooltip("Elastic Snap-back!");
                }
            }
        });

        toggleLabelsBtn.addEventListener('click', () => {
            state.labelsVisible = !state.labelsVisible;
        });

        resetBtn.addEventListener('click', () => {
            state.temperature = 0;
            tempSlider.value = 0;
            tempSlider.dispatchEvent(new Event('input'));
            initNetwork();
        });

        // Start
        initNetwork();
        animate();

    </script>
</body>
</html>
