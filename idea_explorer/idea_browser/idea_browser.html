<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idea Browser</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            font-size: 15px;
        }
        .lens-sidebar {
            width: 400px;
            background: white;
            border-right: 1px solid #ece9f9;
            overflow-y: auto;
            padding: 1.5rem;
        }
        .ideas-sidebar {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            position: relative;
        }
        .ideas-header-sticky {
            position: sticky;
            top: 0;
            z-index: 10;
            background: #f8fafc;
            padding-bottom: 0.5rem;
            padding-top: 0.5rem;
            border-bottom: 1.5px solid #ece9f9;
            margin-bottom: 1.5rem;
        }
        .current-lens-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #7c3aed;
            margin-bottom: 0.7rem;
            line-height: 1.2;
            letter-spacing: -0.01em;
        }
        .ideas-header-sticky .idea-search-input {
            margin-bottom: 0.7rem;
        }
        .idea-count-badge {
            display: inline-flex;
            align-items: center;
            font-size: 0.97rem;
            color: #6B7280;
            background: #f3f4f6;
            border-radius: 9999px;
            padding: 0.18rem 0.85rem 0.18rem 0.7rem;
            font-weight: 500;
            margin-bottom: 0.2rem;
            margin-left: 0.1rem;
            gap: 0.4em;
        }
        .idea-count-badge i {
            font-size: 1em;
            margin-right: 0.4em;
            color: #a78bfa;
        }
        .lens-nav-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 0.5rem;
            word-break: break-word;
            white-space: normal;
            min-height: 2.5rem;
        }
        .lens-nav-item:hover {
            background: #f5f3ff;
        }
        .lens-nav-item.active {
            background: #7c3aed;
            color: white;
        }
        .lens-nav-item.active .lens-count {
            background: white;
            color: #7c3aed;
        }
        .lens-nav-text {
            flex: 1 1 0%;
            white-space: normal;
            word-break: break-word;
            font-size: 1rem;
            line-height: 1.4;
        }
        .lens-count {
            background: #7c3aed;
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-left: 1rem;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            height: 2rem;
        }
        .idea-card {
            background: #fff;
            border-radius: 1rem;
            box-shadow: 0 2px 8px 0 rgba(124,58,237,0.06);
            border: 1px solid #ece9f9;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            transition: all 0.2s ease;
        }
        .idea-card:hover {
            background: #f8f7fc;
        }
        .idea-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid #ece9f9;
        }
        .idea-title {
            color: #1F2937;
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0;
        }
        .idea-description {
            color: #4B5563;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 1rem;
        }
        .lens-tag {
            display: inline-block;
            background: #f3f4f6;
            color: #4B5563;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
            transition: all 0.2s ease;
        }
        .idea-search-input {
            width: 100%;
            padding: 0.5rem 1rem;
            border: 1.5px solid #e5e7eb;
            border-radius: 0.75rem;
            font-size: 1rem;
            margin-bottom: 1rem;
            background: #f8fafc;
            transition: border-color 0.2s;
        }
        .idea-search-input:focus {
            outline: none;
            border-color: #a78bfa;
            background: #f3f4f6;
        }
        .main-content {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
                height: auto;
            }
            .lens-sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #ece9f9;
            }
        }
        .accordion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            cursor: pointer;
            color: #6B7280;
            font-size: 0.9rem;
        }
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }
        .accordion-content.open {
            max-height: 500px;
            padding: 0.5rem 0;
        }
        .accordion-toggle {
            transition: transform 0.3s ease;
        }
        .accordion-toggle.open {
            transform: rotate(180deg);
        }
    </style>
</head>
<body>
    <div class="main-content">
        <!-- Left Sidebar - Lenses -->
        <div class="lens-sidebar">
            <h1 class="text-2xl font-bold text-gray-900 mb-2">Lenses</h1>
            <input type="text" id="lens-search" class="idea-search-input" placeholder="Search lenses..." autocomplete="off" />
            <div class="text-sm text-gray-600 mb-4" id="lens-count-label"></div>
            <div id="lens-nav-list">
                <!-- Lenses will be dynamically inserted here -->
            </div>
        </div>
        <!-- Right Sidebar - Ideas -->
        <div class="ideas-sidebar">
            <div class="ideas-header-sticky">
                <div id="current-lens-title" class="current-lens-title"></div>
                <input type="text" id="idea-search" class="idea-search-input" placeholder="Search ideas in this lens..." autocomplete="off" />
                <div id="idea-count-label" class="idea-count-badge"></div>
            </div>
            <div id="ideas-list">
                <!-- Ideas will be dynamically inserted here -->
            </div>
        </div>
    </div>
    <!-- Load the data -->
    <script src="../../data/idea_lenses_biofilm_phase_1.js"></script>
    <script>
        // Build a map of unique ideas by uuid, and collect lenses for each idea
        const ideaMap = new Map(); // uuid -> { idea, description, lenses: [] }
        const lensToIdeas = new Map(); // lens -> [idea uuids]
        const allLenses = [];
        idea_lenses.forEach(lens => {
            allLenses.push({
                lens: lens.lens,
                count: lens.idea_sparks.length
            });
            lens.idea_sparks.forEach(spark => {
                if (!ideaMap.has(spark.uuid)) {
                    ideaMap.set(spark.uuid, {
                        uuid: spark.uuid,
                        idea: spark.idea,
                        description: spark.description,
                        lenses: []
                    });
                }
                ideaMap.get(spark.uuid).lenses.push(lens.lens);
                if (!lensToIdeas.has(lens.lens)) {
                    lensToIdeas.set(lens.lens, []);
                }
                lensToIdeas.get(lens.lens).push(spark.uuid);
            });
        });
        // Sort lenses by number of ideas
        let sortedLenses = allLenses.sort((a, b) => b.count - a.count);
        let filteredLenses = sortedLenses;
        let activeLensIndex = 0;
        let ideaSearchQuery = '';
        function renderLensNav() {
            const navList = document.getElementById('lens-nav-list');
            const lensCountLabel = document.getElementById('lens-count-label');
            lensCountLabel.textContent = `${filteredLenses.length} lens${filteredLenses.length === 1 ? '' : 'es'} available`;
            navList.innerHTML = filteredLenses.map((lens, index) => `
                <div class="lens-nav-item${index === activeLensIndex ? ' active' : ''}" data-index="${index}">
                    <span class="lens-nav-text">${lens.lens}</span>
                    <span class="lens-count">${lens.count}</span>
                </div>
            `).join('');
            // Add click handlers
            document.querySelectorAll('.lens-nav-item').forEach(item => {
                item.addEventListener('click', () => {
                    document.querySelectorAll('.lens-nav-item').forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                    activeLensIndex = parseInt(item.dataset.index);
                    renderIdeas();
                });
            });
            // Show the first lens by default
            renderIdeas();
        }
        function renderIdeas() {
            const ideasList = document.getElementById('ideas-list');
            const ideaCountLabel = document.getElementById('idea-count-label');
            const lens = filteredLenses[activeLensIndex];
            const currentLensTitle = document.getElementById('current-lens-title');
            if (!lens) {
                currentLensTitle.textContent = '';
                ideaCountLabel.innerHTML = '<i class="fas fa-lightbulb"></i> No lens selected.';
                ideasList.innerHTML = '';
                return;
            }
            currentLensTitle.textContent = lens.lens;
            let ideaUuids = lensToIdeas.get(lens.lens) || [];
            let ideas = ideaUuids.map(uuid => ideaMap.get(uuid));
            // Filter by idea search
            if (ideaSearchQuery.trim() !== '') {
                const q = ideaSearchQuery.trim().toLowerCase();
                ideas = ideas.filter(idea =>
                    idea.idea.toLowerCase().includes(q) ||
                    idea.description.toLowerCase().includes(q)
                );
            }
            ideaCountLabel.innerHTML = `<i class='fas fa-lightbulb'></i> ${ideas.length} idea${ideas.length === 1 ? '' : 's'} found for this lens`;
            ideasList.innerHTML = ideas.map(idea => {
                // Separate current lens and other lenses
                const currentLens = filteredLenses[activeLensIndex]?.lens;
                const otherLenses = idea.lenses.filter(lensName => lensName !== currentLens);
                return `
                    <div class="idea-card">
                        <div class="idea-header">
                            <h3 class="idea-title">${idea.idea}</h3>
                            <span class="lens-count">${idea.lenses.length} lens${idea.lenses.length === 1 ? '' : 'es'}</span>
                        </div>
                        <p class="idea-description">${idea.description}</p>
                        ${otherLenses.length > 0 ? `
                            <div class="accordion-header" onclick="toggleAccordion(this)">
                                <span>${otherLenses.length} other lens${otherLenses.length === 1 ? '' : 'es'}</span>
                                <i class="fas fa-chevron-down accordion-toggle"></i>
                            </div>
                            <div class="accordion-content">
                                ${otherLenses.map(lensName => `
                                    <span class="lens-tag">${lensName}</span>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }
        // Lens search filter
        document.getElementById('lens-search').addEventListener('input', function(e) {
            const query = e.target.value.trim().toLowerCase();
            filteredLenses = sortedLenses.filter(lens => lens.lens.toLowerCase().includes(query));
            activeLensIndex = 0;
            renderLensNav();
        });
        // Idea search filter
        document.getElementById('idea-search').addEventListener('input', function(e) {
            ideaSearchQuery = e.target.value;
            renderIdeas();
        });
        // Initialize the interface
        renderLensNav();
    </script>
    <script>
        // Accordion toggle function for idea cards
        function toggleAccordion(header) {
            const content = header.nextElementSibling;
            const toggle = header.querySelector('.accordion-toggle');
            content.classList.toggle('open');
            toggle.classList.toggle('open');
        }
    </script>
</body>
</html>
