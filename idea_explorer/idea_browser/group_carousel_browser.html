<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Idea Group Carousel Browser</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Avenir', 'Inter', 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Improved color schemes and visual design */
    .carousel-tile {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      cursor: default;
      overflow: visible;
      background: white;
      border-radius: 1.5rem;
      min-height: 240px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      position: relative;
      padding-bottom: 2.5rem;
      border: 1px solid #e5e7eb;
    }
    
    .carousel-tile:hover {
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
      transform: translateY(-6px) scale(1.02);
    }

    /* Enhanced slide color schemes - back to original but improved */
    .slide-theme {
      background: #ede9fe;
      color: #7c3aed;
      position: relative;
    }
    
    .slide-theme.has-thumbnail {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1.5rem 1.2rem 1.5rem;
      min-height: 180px;
    }
    
    .slide-summary {
      background: #e0f2fe;
      color: #0369a1;
    }
    
    .slide-selling {
      background: #fef9c3;
      color: #b45309;
    }
    
    .slide-ideas {
      background: #f3f4f6;
      color: #111827;
    }
    
    .slide-ideas .fa-lightbulb {
      color: #ffd700 !important;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
    }
    
    .slide-ideas .idea-sparks-text {
      color: #bfa100 !important;
      font-weight: bold;
      letter-spacing: 0.02em;
      font-size: 1.8rem;
    }

    .swiper {
      width: 100%;
      min-height: 180px;
      padding-bottom: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .swiper-slide {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 120px;
      padding: 2.5rem 1.5rem 1.5rem 1.5rem;
      border-radius: 1.25rem;
      transition: all 0.3s ease;
    }

    .swiper-pagination {
      bottom: 0.7rem !important;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.7rem;
      padding-bottom: 0.2rem;
    }
    
    .swiper-pagination-bullet {
      width: 10px;
      height: 10px;
      background: rgba(0, 0, 0, 0.2);
      opacity: 1;
      border: 2px solid rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
      margin: 0 2px !important;
      border-radius: 50%;
      cursor: pointer;
    }
    
    .swiper-pagination-bullet-active {
      background: #667eea;
      border: 2px solid #667eea;
      transform: scale(1.2);
    }

    .group-name {
      font-weight: 700;
      font-size: 1.2rem;
      color: #111;
      margin-top: 1.2rem;
      margin-bottom: 0.7rem;
      text-align: center;
      letter-spacing: 0.02em;
    }

    /* Hover button overlay - repositioned to center with more padding */
    .details-button {
      display: block;
      position: static;
      margin: 1.5rem auto 0 auto;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 12px 28px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transform: scale(1);
    }
    
    .details-button:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.18);
    }
    
    .carousel-tile:hover .details-button {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1.05);
    }

    /* View switching animation */
    .view-container {
      position: relative;
      width: 100%;
      min-height: 100vh;
      overflow: hidden;
    }
    
    .overview-view,
    .details-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                  transform 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                  visibility 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1;
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0);
    }
    .overview-view.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(-60px);
    }
    .details-view {
      z-index: 2;
      background: #f8fafc;
      overflow-y: auto;
      transform: translateY(100%);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .details-view.active {
      transform: translateY(0);
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    /* Lighter, subtle header background */
    .details-header {
      position: sticky;
      top: 0;
      left: 0;
      background: linear-gradient(90deg, #f1f5ff 0%, #e0e7ff 100%);
      z-index: 10;
      padding: 2.2rem 2.5rem 1.2rem 2.5rem;
      box-shadow: 0 2px 16px rgba(49,46,129,0.07);
      border-bottom: none;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: space-between;
      gap: 2rem;
    }
    .details-header-main {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.7rem;
      flex: 1 1 0%;
      min-width: 0;
    }
    .details-group-title {
      font-size: 2.1rem;
      font-weight: 800;
      color: #312e81;
      margin-bottom: 0.2rem;
      letter-spacing: -0.01em;
      line-height: 1.1;
    }
    .details-group-summary {
      color: #4b5563;
      font-size: 1.13rem;
      max-width: 70ch;
      font-weight: 400;
      margin-top: 0.2rem;
      margin-bottom: 0.2rem;
    }
    .details-header-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.7rem;
      min-width: 260px;
      flex-shrink: 0;
    }
    .details-header-actions-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.7rem;
    }
    .export-btn, .clipboard-btn {
      background: #fff;
      color: #bfa100;
      border: 2px solid #fffbea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background 0.2s, border 0.2s, color 0.2s;
      box-shadow: 0 1px 4px rgba(191,161,0,0.07);
      margin-left: 0.2rem;
      position: relative;
    }
    .export-btn:hover, .clipboard-btn:hover {
      background: #fffbea;
      color: #bfa100;
      border: 2px solid #bfa100;
    }
    .clipboard-tooltip {
      position: absolute;
      top: -2.1rem;
      left: 50%;
      transform: translateX(-50%);
      background: #bfa100;
      color: #fff;
      font-size: 0.85rem;
      border-radius: 0.4rem;
      padding: 0.2rem 0.7rem;
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
      transition: opacity 0.2s;
      z-index: 10;
    }
    .clipboard-btn.copied .clipboard-tooltip {
      opacity: 1;
    }
    .back-button {
      position: static;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 10px 18px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s, transform 0.2s, border 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.10);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1rem;
      z-index: 10;
      border: 2px solid #fff;
    }
    .back-button:hover {
      background: #4f46e5;
      color: #fff;
      border: 2px solid #FFD700;
      box-shadow: 0 8px 25px rgba(99,102,241,0.18);
      transform: translateY(-2px) scale(1.04);
    }
    .details-idea-count {
      background: #fffbea;
      color: #bfa100;
      font-weight: 700;
      font-size: 1.08rem;
      border-radius: 9999px;
      height: 40px;
      min-width: 140px;
      padding: 0 1.1rem;
      margin-top: 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 1px 4px rgba(191,161,0,0.07);
    }
    .details-idea-count .fa-lightbulb {
      color: #FFD700;
    }
    .curated-ideas-container {
      padding: 2.5rem 2.5rem 3rem 2.5rem;
      background: #f8fafc;
    }
    .curated-idea-card {
      background: #fff;
      border-radius: 1.25rem;
      padding: 2rem 2.2rem 2rem 2.2rem;
      margin-bottom: 2.2rem;
      box-shadow: 0 4px 24px rgba(99,102,241,0.07);
      border-left: 6px solid #6366f1;
      transition: box-shadow 0.2s, transform 0.2s;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .curated-idea-card:hover {
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 8px 32px rgba(99,102,241,0.13);
    }
    .idea-number-badge {
      position: absolute;
      left: -1.7rem;
      top: 1.5rem;
      background: #6366f1;
      color: #fff;
      font-weight: 700;
      font-size: 1.1rem;
      border-radius: 50%;
      width: 2.2rem;
      height: 2.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(99,102,241,0.13);
    }
    .curated-idea-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 0.7rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-left: 2.2rem;
    }
    .idea-summary-text {
      color: #374151;
      margin-bottom: 1.5rem;
      line-height: 1.7;
      font-size: 1.08rem;
      margin-left: 2.2rem;
    }
    .idea-detail-section {
      margin-bottom: 1.1rem;
      margin-left: 2.2rem;
    }
    .idea-detail-label {
      font-size: 0.93rem;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .idea-detail-content {
      color: #374151;
      line-height: 1.6;
      padding: 0.9rem 1.1rem;
      background: #f8fafc;
      border-radius: 0.75rem;
      border-left: 4px solid #e5e7eb;
    }
    .idea-detail-content.core-principle {
      border-left-color: #3b82f6;
      background: #eff6ff;
    }
    .idea-detail-content.form-factor {
      border-left-color: #10b981;
      background: #ecfdf5;
    }
    .idea-detail-content.mode-of-action {
      border-left-color: #f59e0b;
      background: #fffbeb;
    }
    .mode-of-action-list {
      list-style-position: inside;
      list-style-type: decimal;
      margin: 0;
      padding: 0;
    }
    .mode-of-action-list li {
      margin-bottom: 0.5rem;
      padding-left: 0.5rem;
    }
    .stats-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      background: #f3f4f6;
      color: #6b7280;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      margin-left: 0.5rem;
    }
    /* Scroll indicator */
    .scroll-indicator {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: rgba(255, 255, 255, 0.9);
      color: #667eea;
      border: none;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      font-size: 1.5rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      z-index: 100;
      display: none;
    }
    
    .scroll-indicator:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }
    
    .scroll-indicator.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .details-header,
    .details-header * {
      font-family: 'Avenir', 'Inter', 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif !important;
    }
    .curated-idea-card,
    .curated-idea-card * {
      font-family: 'Avenir', 'Inter', 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif !important;
    }
    .carousel-tile,
    .carousel-tile * {
      font-family: 'Avenir', 'Inter', 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif !important;
    }

    .fa, .fas, .far, .fal, .fab {
      font-family: 'Font Awesome 6 Free', 'Font Awesome 5 Free', 'FontAwesome', sans-serif !important;
      font-weight: 900 !important;
    }

    .carousel-thumbnail-image-container {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.5rem;
    }
    .carousel-thumbnail-image {
      max-width: 180px;
      max-height: 120px;
      border-radius: 1rem;
      box-shadow: 0 4px 16px rgba(124,58,237,0.13);
      object-fit: contain;
      background: #fff;
      border: 2px solid #ede9fe;
      transition: box-shadow 0.2s;
    }
    .slide-theme.has-thumbnail .carousel-thumbnail-image {
      margin-bottom: 0.5rem;
    }
  </style>
  <script src="../../data/idea_curation_test_v2.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
</head>
<body>
  <div class="view-container">
    <!-- Overview View -->
    <div class="overview-view" id="overview-view">
      <div class="max-w-7xl mx-auto py-10 px-4">
        <h1 class="text-4xl font-bold text-gray-900 mb-3 text-center">Browse Idea Groups</h1>
        <p class="text-gray-600 text-lg mb-12 text-center max-w-3xl mx-auto">
          Explore creative solution themes. Hover to preview carousel, click details button for full exploration.
        </p>
        <div id="carousel-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
      </div>
    </div>

    <!-- Details View -->
    <div class="details-view" id="details-view">
      <div id="details-content"></div>
    </div>
  </div>

  <button class="scroll-indicator" id="scroll-indicator">
    <i class="fas fa-chevron-up"></i>
  </button>

  <script>
    /* --------------------------------------------------
       CONFIGURATION
    -------------------------------------------------- */
    const AUTOPLAY_INTERVAL = 2000; // ms
    // Base path for images (replace '/app/' in thumbnail_image_path)
    const IMAGE_BASE_PATH = '/Users/vikrammohanty/Desktop/work/code/analogy-explorer-dev/idea_factory_engine/';

    /* --------------------------------------------------
       Extract data from idea_curation_test
    -------------------------------------------------- */
    const groupData = Array.isArray(idea_curation_test?.groups)
      ? idea_curation_test.groups
      : [];

    /* --------------------------------------------------
       DOM helpers
    -------------------------------------------------- */
    const qs = (sel, el = document) => el.querySelector(sel);
    const qsa = (sel, el = document) => Array.from(el.querySelectorAll(sel));

    /* --------------------------------------------------
       View management
    -------------------------------------------------- */
    const overviewView = qs("#overview-view");
    const detailsView = qs("#details-view");
    const scrollIndicator = qs("#scroll-indicator");

    function showDetailsView() {
      overviewView.classList.add("hidden");
      detailsView.classList.add("active");
      document.body.style.overflow = "hidden";
    }

    function showOverviewView() {
      overviewView.classList.remove("hidden");
      detailsView.classList.remove("active");
      document.body.style.overflow = "auto";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // Scroll indicator functionality
    window.addEventListener("scroll", () => {
      if (window.scrollY > 300) {
        scrollIndicator.classList.add("show");
      } else {
        scrollIndicator.classList.remove("show");
      }
    });

    scrollIndicator.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    /* --------------------------------------------------
       Build card markup & attach behaviour per card
    -------------------------------------------------- */
    const grid = qs("#carousel-grid");

    groupData.forEach((group, idx) => {
      // --- Build card shell -------------------------------------------------
      const cardWrap = document.createElement("div");
      cardWrap.className = "flex flex-col items-center";

      const card = document.createElement("div");
      card.className =
        "carousel-tile flex flex-col items-center justify-center mb-4 w-full transition-transform duration-200 relative";
      card.dataset.index = idx;

      /* ----------- Swiper container + slides (static markup) --------------- */
      card.innerHTML = `
        <div class="swiper" style="border-radius:1.25rem;overflow:hidden;min-height:180px;">
          <div class="swiper-wrapper"></div>
          <div class="swiper-pagination"></div>
        </div>
        <button class="details-button" data-group-index="${idx}">
          <i class="fas fa-arrow-right mr-2"></i>
          View Details
        </button>`;

      cardWrap.appendChild(card);
      grid.appendChild(cardWrap);

      // Group name label
      const groupNameEl = document.createElement("div");
      groupNameEl.className = "group-name";
      groupNameEl.textContent = group.group_name;
      cardWrap.appendChild(groupNameEl);

      // Populate slides
      const slides = [];
      // Hero slide: image if available, else fallback to icon/text
      if (group.thumbnail_image_path) {
        let imgPath = group.thumbnail_image_path;
        if (imgPath.startsWith('/app/')) {
          imgPath = IMAGE_BASE_PATH + imgPath.slice(5);
        }
        slides.push({
          image: imgPath,
          text: group.descriptive_title,
          slideClass: "slide-theme has-thumbnail",
          isImage: true
        });
      } else {
        slides.push({
          icon: "fa-bolt",
          text: group.descriptive_title,
          slideClass: "slide-theme",
        });
      }
      // Other slides as before
      slides.push(
        {
          icon: "fa-quote-left",
          text: group.one_liner_summary,
          slideClass: "slide-summary",
        },
        {
          icon: "fa-star",
          text: group.selling_point,
          slideClass: "slide-selling",
        },
        {
          icon: "fa-lightbulb",
          text: `${group.curated_ideas.length} Idea Sparks`,
          slideClass: "slide-ideas",
          custom: true,
        }
      );

      const swiperWrapper = qs(".swiper-wrapper", card);
      slides.forEach((s) => {
        const slideEl = document.createElement("div");
        slideEl.className = `swiper-slide ${s.slideClass}`;
        if (s.isImage && s.image) {
          slideEl.innerHTML = `
            <div class="carousel-thumbnail-image-container">
              <img src="${s.image}" alt="Group Thumbnail" class="carousel-thumbnail-image" />
            </div>
            <span class="block text-xl font-bold mt-3">${s.text}</span>
          `;
        } else if (s.custom) {
          slideEl.innerHTML = `<span class="text-4xl mb-3"><i class="fas ${s.icon}"></i></span><span class="block text-xl idea-sparks-text mb-2">${s.text}</span>`;
        } else {
          slideEl.innerHTML = `<span class="text-4xl mb-3"><i class="fas ${s.icon}"></i></span><span class="block text-xl font-bold mb-2">${s.text}</span>`;
        }
        swiperWrapper.appendChild(slideEl);
      });

      /* --------------------------------------------------
         Attach interactive behaviour (self-contained per card)
      -------------------------------------------------- */
      initCardInteractions(card, group, idx);
    });

    /* ==================================================
       CARD INTERACTION LOGIC (runs once per card)
    ================================================== */
    function initCardInteractions(card, group, groupIndex) {
      const paginationEl = qs(".swiper-pagination", card);
      const detailsButton = qs(".details-button", card);

      const swiper = new Swiper(qs(".swiper", card), {
        slidesPerView: 1,
        effect: "fade",
        fadeEffect: { crossFade: true },
        pagination: {
          el: paginationEl,
          clickable: true,
        },
        allowTouchMove: true,
        speed: 400,
        autoHeight: true,
      });

      let autoplayId = null;
      let manualDotClick = false;

      function startAutoplay() {
        if (autoplayId) return; // already running
        autoplayId = setInterval(() => {
          const next =
            swiper.activeIndex === swiper.slides.length - 1 ? 0 : swiper.activeIndex + 1;
          swiper.slideTo(next, 400);
        }, AUTOPLAY_INTERVAL);
      }

      function stopAutoplay() {
        clearInterval(autoplayId);
        autoplayId = null;
      }

      function resetToFirst() {
        swiper.slideTo(0, 400);
      }

      /* ---------- Mouse interactions ------------------ */
      card.addEventListener("mouseenter", () => {
        startAutoplay();
      });

      card.addEventListener("mouseleave", () => {
        stopAutoplay();
        if (!manualDotClick) resetToFirst();
        // allow future auto-reset after short delay
        setTimeout(() => {
          manualDotClick = false;
        }, 600);
      });

      // treat hover on pagination as manual
      paginationEl.addEventListener('mouseenter', () => {       
        manualDotClick = true;
        stopAutoplay();
      });

      /* ---------- Pagination dot clicks --------------- */
      paginationEl.addEventListener("click", (e) => {
        if (e.target.classList.contains("swiper-pagination-bullet")) {
          manualDotClick = true;
          stopAutoplay();
          e.stopPropagation();
        }
      });

      /* ---------- Details button click --------------- */
      detailsButton.addEventListener("click", (e) => {
        e.stopPropagation();
        stopAutoplay();
        openDetailsView(group);
      });
    }

    /* --------------------------------------------------
       Details view builder
    -------------------------------------------------- */
    function openDetailsView(group) {
      const detailsContent = qs("#details-content");
      
      function formatModeOfAction(text) {
        const items = text.split(/(?=\d+\.\s)/).map(s => s.trim()).filter(Boolean);
        if (items.length > 1) {
          return `<ol class="mode-of-action-list">${items.map(item => `<li>${item.replace(/^\d+\.\s/, '')}</li>`).join('')}</ol>`;
        }
        return `<p>${text}</p>`;
      }

      let curatedIdeasHtml = '';
      group.curated_ideas.forEach((idea, idx) => {
        curatedIdeasHtml += `
          <div class="curated-idea-card">
            <span class="idea-number-badge">${idx + 1}</span>
            <h3 class="curated-idea-title">
              <i class="fas fa-lightbulb text-yellow-500"></i>
              ${idea.optimized_idea}
              <span class="stats-badge">
                <i class="fas fa-lightbulb"></i>
                ${idea.source_sparks.length} source${idea.source_sparks.length !== 1 ? 's' : ''}
              </span>
            </h3>
            <p class="idea-summary-text">${idea.idea_summary}</p>
            
            <div class="idea-detail-section">
              <div class="idea-detail-label">
                <i class="fas fa-atom text-blue-500"></i>
                Core Principle
              </div>
              <div class="idea-detail-content core-principle">
                ${idea.core_principle}
              </div>
            </div>

            <div class="idea-detail-section">
              <div class="idea-detail-label">
                <i class="fas fa-cube text-green-500"></i>
                Form Factor
              </div>
              <div class="idea-detail-content form-factor">
                ${idea.form_factor}
              </div>
            </div>

            <div class="idea-detail-section">
              <div class="idea-detail-label">
                <i class="fas fa-cogs text-yellow-500"></i>
                Mode of Action
              </div>
              <div class="idea-detail-content mode-of-action">
                ${formatModeOfAction(idea.mode_of_action)}
              </div>
            </div>
          </div>
        `;
      });

      detailsContent.innerHTML = `
        <div class="details-header">
          <div class="details-header-main">
            <span class="details-group-title">
              ${group.group_name}
            </span>
            <div class="details-group-summary">${group.group_summary}</div>
          </div>
          <div class="details-header-actions">
            <div class="details-header-actions-row" style="margin-bottom: 0.5rem;">
              <button class="back-button" id="back-button">
                <i class="fas fa-arrow-left"></i>
                Back to Overview
              </button>
            </div>
            <div class="details-header-actions-row">
              <span class="details-idea-count">
                <i class="fas fa-lightbulb"></i>
                ${group.curated_ideas.length} Idea Spark${group.curated_ideas.length !== 1 ? 's' : ''}
              </span>
              <button class="export-btn" id="export-group-btn" title="Download JSON">
                <i class="fas fa-download"></i>
              </button>
              <button class="clipboard-btn" id="clipboard-group-btn" title="Copy JSON to Clipboard">
                <i class="fas fa-clipboard"></i>
                <span class="clipboard-tooltip">Copied!</span>
              </button>
            </div>
          </div>
        </div>
        <div class="curated-ideas-container">
          ${curatedIdeasHtml}
        </div>
      `;

      showDetailsView();

      // Always re-attach the event listener after rendering
      qs('#back-button', detailsContent).onclick = showOverviewView;

      // Add export and clipboard logic after rendering
      const exportBtn = qs('#export-group-btn', detailsContent);
      const clipboardBtn = qs('#clipboard-group-btn', detailsContent);
      if (exportBtn) {
        exportBtn.onclick = function() {
          // Deep copy group and remove source_sparks from each idea
          const groupCopy = JSON.parse(JSON.stringify(group));
          if (Array.isArray(groupCopy.curated_ideas)) {
            groupCopy.curated_ideas.forEach(idea => {
              delete idea.source_sparks;
            });
          }
          const groupData = JSON.stringify(groupCopy, null, 2);
          const blob = new Blob([groupData], {type: 'application/json'});
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          const safeName = (group.group_name || 'group').replace(/[^a-z0-9]+/gi, '_').toLowerCase();
          a.download = `group_export_${safeName}.json`;
          document.body.appendChild(a);
          a.click();
          setTimeout(() => {
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          }, 100);
        };
      }
      if (clipboardBtn) {
        clipboardBtn.onclick = async function() {
          try {
            // Deep copy group and remove source_sparks from each idea
            const groupCopy = JSON.parse(JSON.stringify(group));
            if (Array.isArray(groupCopy.curated_ideas)) {
              groupCopy.curated_ideas.forEach(idea => {
                delete idea.source_sparks;
              });
            }
            await navigator.clipboard.writeText(JSON.stringify(groupCopy, null, 2));
            clipboardBtn.classList.add('copied');
            setTimeout(() => clipboardBtn.classList.remove('copied'), 1200);
          } catch (err) {
            alert('Failed to copy to clipboard');
          }
        };
      }
    }

    // On page load, ensure only overview is visible
    overviewView.classList.remove("hidden");
    detailsView.classList.remove("active");
  </script>
</body>
</html>
