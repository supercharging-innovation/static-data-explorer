<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lens Hierarchy Browser</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        @font-face {
            font-family: 'Avenir';
            src: local('Avenir'), local('Avenir Next'), local('AvenirNext-Regular');
            font-weight: 400;
        }
        body {
            font-family: 'Avenir', 'Inter', sans-serif;
            background: #f8fafc;
            color: #1f2937;
            height: 100vh;
            overflow: hidden;
        }
        .main-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .active-ingredient-bar {
            background: linear-gradient(90deg, #ede9fe 0%, #f3f4f6 100%);
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
        }
        .active-ingredient-card {
            background: white;
            border-radius: 1.25rem;
            box-shadow: 0 2px 12px 0 rgba(124,58,237,0.08);
            margin: 1.5rem 0;
            width: 96vw;
            max-width: 1600px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.5rem 2.5rem;
            gap: 2rem;
        }
        .active-ingredient-header {
            font-size: 1.25rem;
            font-weight: 700;
            color: #7c3aed;
            margin-bottom: 0.25rem;
            letter-spacing: -0.01em;
            min-width: 180px;
            text-align: left;
        }
        .active-ingredient-text {
            font-size: 1.08rem;
            color: #1f2937;
            font-weight: 500;
            text-align: left;
        }
        @media (max-width: 900px) {
            .active-ingredient-card {
                flex-direction: column;
                align-items: flex-start;
                padding: 1.2rem 1rem;
            }
            .active-ingredient-header {
                margin-bottom: 0.5rem;
            }
        }
        .content-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .lens-sidebar {
            width: 50%;
            min-width: 0;
            background: white;
            border-right: 1px solid #e5e7eb;
            overflow-y: auto;
            padding: 2rem 2rem 2rem 2.5rem;
        }
        .ideas-panel {
            width: 50%;
            min-width: 0;
            background: #f8fafc;
            overflow-y: auto;
            padding: 2rem 2.5rem 2rem 2rem;
        }
        .lens-node {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin: 0.5rem 0;
            transition: all 0.3s ease;
        }
        .lens-header {
            padding: 1.25rem 1.25rem 0.75rem 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            border-radius: 1rem 1rem 0 0;
            transition: background-color 0.2s ease;
        }
        .lens-header:hover, .lens-header.selected {
            background-color: #ede9fe;
        }
        .lens-content {
            padding: 0 1.25rem 1.25rem;
            color: #4b5563;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .lens-children {
            margin-left: 2rem;
            border-left: 2px solid #e5e7eb;
            padding-left: 1rem;
            transition: all 0.3s ease;
        }
        .toggle-icon {
            transition: transform 0.3s ease;
            color: #6b7280;
            margin-left: 0.75rem;
            font-size: 1.1rem;
        }
        .toggle-icon.open {
            transform: rotate(180deg);
        }
        .lens-name {
            font-weight: 600;
            color: #1f2937;
            font-size: 1.1rem;
            font-family: 'Avenir', 'Inter', sans-serif;
        }
        .lens-description {
            color: #6b7280;
            font-size: 0.93rem;
            margin-top: 0.5rem;
            font-family: 'Avenir', 'Inter', sans-serif;
        }
        .lens-badges-row {
            display: flex;
            align-items: center;
            gap: 1.1rem;
            margin-top: 0.7rem;
            margin-bottom: 0.1rem;
        }
        .lens-badge {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            background: #f3f0ff;
            color: #7c3aed;
            font-size: 0.93rem;
            font-weight: 600;
            border-radius: 9999px;
            padding: 0.18rem 0.85rem 0.18rem 0.7rem;
            box-shadow: 0 1px 2px rgba(124,58,237,0.04);
        }
        .lens-badge i {
            font-size: 1.05em;
        }
        .search-container {
            margin-bottom: 1.5rem;
        }
        .search-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 0.75rem;
            font-size: 1rem;
            transition: all 0.2s ease;
            font-family: 'Avenir', 'Inter', sans-serif;
        }
        .search-input:focus {
            outline: none;
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }
        .idea-card {
            background: #f7f6fd;
            border-radius: 1rem;
            padding: 1.25rem 1.5rem 1.25rem 1.5rem;
            margin-bottom: 2.1rem;
            box-shadow: 0 2px 8px rgba(124,58,237,0.06);
            border-left: 6px solid #FFD700;
            position: relative;
            transition: box-shadow 0.2s, border-color 0.2s;
            font-family: 'Avenir', 'Inter', sans-serif;
        }
        .idea-card:hover {
            box-shadow: 0 4px 16px rgba(124,58,237,0.13);
            border-left: 6px solid #fbbf24;
        }
        .idea-title {
            font-weight: 700;
            color: #1f2937;
            font-size: 1.13rem;
            margin-bottom: 0.5rem;
            font-family: 'Avenir', 'Inter', sans-serif;
        }
        .idea-description {
            color: #4b5563;
            font-size: 0.99rem;
            line-height: 1.6;
            font-family: 'Avenir', 'Inter', sans-serif;
        }
        .no-ideas-message {
            text-align: center;
            color: #6b7280;
            padding: 2rem;
            font-size: 1.1rem;
        }
        .idea-sparks-header {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            font-family: 'Avenir', 'Inter', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.7rem;
        }
        .idea-sparks-header .fa-lightbulb {
            color: #FFD700;
            font-size: 1.7rem;
            margin-left: 0.5rem;
        }
        .lens-header-label {
            font-size: 1.1rem;
            font-weight: 700;
            color: #7c3aed;
            margin-bottom: 0.5rem;
            letter-spacing: 0.01em;
            font-family: 'Avenir', 'Inter', sans-serif;
        }
        .current-lens-info {
            background: #fff;
            border-radius: 0.75rem;
            box-shadow: 0 1px 6px rgba(124,58,237,0.06);
            padding: 1.1rem 1.5rem 1.1rem 1.5rem;
            margin-bottom: 2.2rem;
            border-left: 4px solid #7c3aed;
        }
        .current-lens-title {
            font-size: 1.08rem;
            font-weight: 600;
            color: #7c3aed;
            margin-bottom: 0.2rem;
            font-family: 'Avenir', 'Inter', sans-serif;
        }
        .current-lens-desc {
            color: #4b5563;
            font-size: 0.97rem;
            font-family: 'Avenir', 'Inter', sans-serif;
            margin-bottom: 0.7rem;
        }
        .current-lens-ideas-count {
            color: #7c3aed;
            font-size: 1rem;
            font-weight: 600;
            margin-top: 0.2rem;
            font-family: 'Avenir', 'Inter', sans-serif;
        }
        @media (max-width: 900px) {
            .content-container { flex-direction: column; }
            .lens-sidebar, .ideas-panel { width: 100%; min-width: 0; padding: 1rem; }
        }
        .current-lens-card {
            box-shadow: 0 4px 16px 0 rgba(124,58,237,0.10);
            position: relative;
            overflow: visible;
        }
        .current-lens-card .fa-lightbulb {
            color: #facc15;
        }
        .current-lens-badge {
            position: absolute;
            top: -1.2rem;
            left: 1.5rem;
            box-shadow: 0 2px 8px rgba(124,58,237,0.10);
            pointer-events: none;
        }
        .empty-bulb {
            min-height: 300px;
            color: #facc15;
            opacity: 0.7;
        }
        .collapse-toggle {
            background: none;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 0;
            margin-bottom: 0.2rem;
            transition: color 0.2s;
        }
        .collapse-toggle i {
            transition: transform 0.2s;
        }
        .collapse-content {
            transition: max-height 0.3s ease;
        }
        .draggable-lens {
            cursor: grab;
            transition: box-shadow 0.2s, border 0.2s;
        }
        .draggable-lens.dragging {
            opacity: 0.6;
            box-shadow: 0 0 0 2px #a78bfa, 0 4px 16px rgba(124,58,237,0.13);
        }
        .draggable-lens.drag-over {
            border: 2px dashed #a78bfa;
            background: #f3f0ff;
        }
        .lens-glow {
            box-shadow: 0 0 0 4px #a78bfa, 0 4px 16px rgba(124,58,237,0.13) !important;
            transition: box-shadow 0.4s;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Active Ingredient Bar -->
        <div class="active-ingredient-bar">
            <div class="active-ingredient-card">
                <div class="active-ingredient-header">Active Ingredient</div>
                <div class="active-ingredient-text" id="active-ingredient-text">Loading active ingredient...</div>
            </div>
        </div>
        <div class="content-container">
            <!-- Left Sidebar - Lenses -->
            <div class="lens-sidebar">
                <h1 class="text-2xl font-bold text-gray-900 mb-2" style="font-family: 'Avenir', 'Inter', sans-serif;">Explore Idea Themes</h1>
                <p class="text-gray-600 text-sm mb-4">Browse creative themes and perspectives</p>
                <div id="hierarchy-tree"></div>
            </div>
            <!-- Right Panel - Ideas -->
            <div class="ideas-panel">
                <div id="idea-sparks-header" class="mb-7 flex items-center justify-between">
                    <h2 class="text-3xl font-bold text-gray-900" style="font-family: 'Avenir', 'Inter', sans-serif;">Idea Sparks</h2>
                    <div class="flex items-center gap-2">
                        <span id="idea-sparks-count-badge" class="bg-yellow-100 text-yellow-700 font-semibold text-base px-4 py-1 rounded-full border border-yellow-200 shadow-sm flex items-center gap-2">
                            <i class="fas fa-lightbulb text-yellow-400"></i>
                            <span id="idea-sparks-count-text"></span>
                        </span>
                        <button id="export-lens-btn" title="Export Lens & Ideas" style="display:none;" class="ml-1 p-2 bg-purple-100 hover:bg-purple-200 text-purple-700 rounded-full transition-colors flex items-center justify-center text-lg shadow-none border border-purple-200">
                            <i class="fas fa-download"></i>
                        </button>
                        <button id="clipboard-lens-btn" title="Copy JSON to Clipboard" style="display:none;" class="ml-1 p-2 bg-purple-100 hover:bg-purple-200 text-purple-700 rounded-full transition-colors flex items-center justify-center text-lg shadow-none border border-purple-200 relative">
                            <i class="fas fa-clipboard"></i>
                            <span id="clipboard-copied-tooltip" class="absolute -top-7 left-1/2 -translate-x-1/2 bg-purple-700 text-white text-xs rounded px-2 py-1 shadow transition-opacity opacity-0 pointer-events-none">Copied!</span>
                        </button>
                    </div>
                </div>
                <div id="current-lens-card"></div>
                <div id="ideas-container"></div>
            </div>
        </div>
    </div>
    <script src="../../data/idea_lenses_biofilm_hierarchy_v2.js"></script>
    <script>
        // --- Helper: Aggregate unique idea counts and sub-lens/depth for all nodes ---
        function collectAllUniqueIdeaUuids(lens, seen = new Set()) {
            if (lens.idea_spark_uuids && Array.isArray(lens.idea_spark_uuids)) {
                lens.idea_spark_uuids.forEach(uuid => seen.add(uuid));
            }
            if (lens.children && lens.children.length > 0) {
                lens.children.forEach(child => collectAllUniqueIdeaUuids(child, seen));
            }
            return seen;
        }
        function aggregateLensStats(node, depth = 1) {
            const uniqueIdeas = collectAllUniqueIdeaUuids(node);
            let subLensCount = 0;
            let maxDepth = depth;
            if (node.children && node.children.length > 0) {
                subLensCount += node.children.length;
                node.children.forEach(child => {
                    const childStats = aggregateLensStats(child, depth + 1);
                    subLensCount += childStats.subLensCount;
                    if (childStats.maxDepth > maxDepth) maxDepth = childStats.maxDepth;
                });
            }
            node._unique_idea_count = uniqueIdeas.size;
            node._total_sub_lens_count = subLensCount;
            node._max_depth = maxDepth - depth + 1;
            return { uniqueIdeas, subLensCount, maxDepth };
        }
        idea_lenses_hierarchy.taxonomy.forEach(root => aggregateLensStats(root));
        let selectedLensNode = null;
        function createLensNode(lens, depth = 0) {
            const hasChildren = lens.children && lens.children.length > 0;
            const node = document.createElement('div');
            node.className = 'lens-node';
            node.dataset.uuid = lens.uuid;
            node.dataset.depth = depth;
            // Header
            const header = document.createElement('div');
            header.className = 'lens-header';
            header.innerHTML = `
                <div style="flex:1;min-width:0;">
                    <div class="lens-name">${lens.name}</div>
                    <div class="lens-description">${lens.description}</div>
                    <div class="lens-badges-row">
                        <span class="lens-badge"><i class="fas fa-lightbulb"></i> Ideas: ${lens._unique_idea_count}</span>
                        <span class="lens-badge"><i class="fas fa-layer-group"></i> Sub-lenses: ${lens._total_sub_lens_count}</span>
                        <span class="lens-badge"><i class="fas fa-sitemap"></i> Depth: ${lens._max_depth}</span>
                    </div>
                </div>
                <div class="flex items-center" style="margin-left:1rem;">
                    ${hasChildren ? '<i class="fas fa-chevron-down toggle-icon"></i>' : ''}
                </div>
            `;
            // Content (children)
            const content = document.createElement('div');
            content.className = 'lens-content';
            content.style.display = 'none';
            if (hasChildren) {
                const childrenContainer = document.createElement('div');
                childrenContainer.className = 'lens-children';
                lens.children.forEach(child => {
                    childrenContainer.appendChild(createLensNode(child, depth + 1));
                });
                content.appendChild(childrenContainer);
            }
            node.appendChild(header);
            node.appendChild(content);
            // Expand/collapse and scroll/glow logic
            header.addEventListener('click', e => {
                if (e.target.classList.contains('toggle-icon')) {
                    const isOpen = content.style.display !== 'none';
                    content.style.display = isOpen ? 'none' : 'block';
                    header.querySelector('.toggle-icon').classList.toggle('open');
                    return;
                }
                // Collapse siblings' children
                const parent = node.parentElement;
                if (parent && parent.classList.contains('lens-children')) {
                    Array.from(parent.children).forEach(sibling => {
                        if (sibling !== node) {
                            const siblingContent = sibling.querySelector(':scope > .lens-content');
                            const siblingIcon = sibling.querySelector(':scope > .lens-header .toggle-icon');
                            if (siblingContent) siblingContent.style.display = 'none';
                            if (siblingIcon) siblingIcon.classList.remove('open');
                        }
                    });
                } else if (depth === 0) {
                    // Top-level: collapse other top-levels
                    document.querySelectorAll('.lens-node[data-depth="0"]').forEach(topNode => {
                        if (topNode !== node) {
                            const topContent = topNode.querySelector(':scope > .lens-content');
                            const topIcon = topNode.querySelector(':scope > .lens-header .toggle-icon');
                            if (topContent) topContent.style.display = 'none';
                            if (topIcon) topIcon.classList.remove('open');
                        }
                    });
                }
                // Expand this node if it has children
                if (hasChildren) {
                    content.style.display = 'block';
                    const icon = header.querySelector('.toggle-icon');
                    if (icon) icon.classList.add('open');
                }
                // Scroll this node to top of sidebar
                setTimeout(() => {
                    // Scroll with offset from top
                    const sidebar = document.querySelector('.lens-sidebar');
                    const nodeRect = node.getBoundingClientRect();
                    const sidebarRect = sidebar.getBoundingClientRect();
                    const offset = 20; // px gap from top
                    const scrollTop = sidebar.scrollTop + (nodeRect.top - sidebarRect.top) - offset;
                    sidebar.scrollTo({ top: scrollTop, behavior: 'smooth' });
                    // Glow effect
                    node.classList.add('lens-glow');
                    setTimeout(() => node.classList.remove('lens-glow'), 900);
                }, 0);
                selectLens(lens, header);
            });
            return node;
        }
        function selectLens(lens, headerEl) {
            document.querySelectorAll('.lens-header').forEach(h => h.classList.remove('selected'));
            headerEl.classList.add('selected');
            selectedLensNode = lens;
            renderIdeas(lens);
            // Scroll right panel to top
            const ideasPanel = document.querySelector('.ideas-panel');
            if (ideasPanel) {
                ideasPanel.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }
        function renderIdeas(lens) {
            const container = document.getElementById('ideas-container');
            const lensCard = document.getElementById('current-lens-card');
            const sparksBadge = document.getElementById('idea-sparks-count-badge');
            const sparksCountText = document.getElementById('idea-sparks-count-text');
            const exportBtn = document.getElementById('export-lens-btn');
            const clipboardBtn = document.getElementById('clipboard-lens-btn');
            const clipboardTooltip = document.getElementById('clipboard-copied-tooltip');
            container.innerHTML = '';
            // Show current lens info in a prominent card
            if (!lens) {
                lensCard.innerHTML = '';
                if (sparksCountText) sparksCountText.textContent = '';
                if (exportBtn) exportBtn.style.display = 'none';
                if (clipboardBtn) clipboardBtn.style.display = 'none';
                container.innerHTML = `<div class="empty-bulb flex flex-col items-center justify-center h-full w-full" style="min-height: 300px;">
                    <i class="fas fa-lightbulb text-yellow-300" style="font-size: 4rem;"></i>
                </div>`;
                return;
            }
            if (exportBtn) exportBtn.style.display = '';
            if (clipboardBtn) clipboardBtn.style.display = '';
            const uniqueUuids = Array.from(collectAllUniqueIdeaUuids(lens));
            lensCard.innerHTML = `
                <div class="current-lens-card bg-white rounded-2xl shadow-lg border border-purple-200 p-6 mb-8 flex flex-col gap-2 relative">
                    <span class="current-lens-badge absolute -top-4 left-6 bg-purple-100 text-purple-700 text-xs font-bold px-3 py-1 rounded-full border border-purple-200 shadow" style="z-index:2;">Current Lens</span>
                    <div class="flex items-center gap-3 mb-2">
                        <h3 class="text-xl font-semibold text-gray-900">${lens.name}</h3>
                    </div>
                    <div class="text-gray-600 text-base mb-1">${lens.description || ''}</div>
                </div>
            `;
            // Set the idea sparks count badge in the header
            if (sparksCountText) {
                sparksCountText.textContent = `${uniqueUuids.length} Idea Spark${uniqueUuids.length === 1 ? '' : 's'}`;
            }
            // Collect all unique idea_spark_uuids in this node's subtree
            if (!uniqueUuids.length) {
                container.innerHTML = `<div class="no-ideas-message">No ideas associated with this lens</div>`;
                return;
            }
            // Sort by interestingness (impact as fallback)
            uniqueUuids.sort((a, b) => {
                const ia = idea_lenses_hierarchy.idea_spark_lookup[a];
                const ib = idea_lenses_hierarchy.idea_spark_lookup[b];
                const scoreA = ia && ia.interestingness_score !== undefined ? ia.interestingness_score : (ia && ia.impact_score !== undefined ? ia.impact_score : 0);
                const scoreB = ib && ib.interestingness_score !== undefined ? ib.interestingness_score : (ib && ib.impact_score !== undefined ? ib.impact_score : 0);
                return scoreB - scoreA;
            });
            uniqueUuids.forEach((uuid, idx) => {
                const idea = idea_lenses_hierarchy.idea_spark_lookup[uuid];
                if (!idea) return;
                // Badge helpers
                function badge(label, icon, score, color, rationale) {
                    if (score === undefined || rationale === undefined) return '';
                    return `<div class="flex items-start mb-2">
                        <span class="inline-flex items-center font-semibold text-sm px-3 py-1 rounded-full mr-3 justify-start" style="background:${color.bg};color:${color.text};width:140px;min-width:140px;max-width:140px;">
                            <i class="fas ${icon} mr-1"></i> ${label}: ${score}/5
                        </span>
                        <span class="text-gray-700 text-sm flex-1">${rationale}</span>
                    </div>`;
                }
                // Collapsible section helper
                function collapsible(title, content, sectionId, innerHtml) {
                    // If innerHtml is provided, use it as the content (for badges section)
                    if (innerHtml) {
                        return `<div class="mb-2">
                            <button class="collapse-toggle flex items-center text-sm font-medium text-gray-700 hover:text-gray-900 focus:outline-none" data-target="${sectionId}">
                                <i class="fas fa-chevron-right mr-2 transition-transform"></i>
                                ${title}
                            </button>
                            <div id="${sectionId}" class="collapse-content pl-6 mt-1 hidden">
                                ${innerHtml}
                            </div>
                        </div>`;
                    }
                    if (!content || !Array.isArray(content) || !content.length) return '';
                    return `<div class="mb-2">
                        <button class="collapse-toggle flex items-center text-sm font-medium text-gray-700 hover:text-gray-900 focus:outline-none" data-target="${sectionId}">
                            <i class="fas fa-chevron-right mr-2 transition-transform"></i>
                            ${title}
                        </button>
                        <div id="${sectionId}" class="collapse-content pl-6 mt-1 hidden">
                            <ul class="list-disc list-inside text-sm text-gray-600">
                                ${content.map(item => `<li>${item}</li>`).join('')}
                            </ul>
                        </div>
                    </div>`;
                }
                // Colors/icons for badges
                const badgeStyles = {
                    feasibility: { bg: '#FEF3C7', text: '#92400E', icon: 'fa-tools' },
                    novelty: { bg: '#FEF3C7', text: '#B45309', icon: 'fa-star' },
                    impact: { bg: '#DEF7EC', text: '#03543F', icon: 'fa-bolt' }
                };
                // Render card
                const ideaCard = document.createElement('div');
                ideaCard.className = 'idea-card bg-blue-50 rounded-xl p-6 mb-6 shadow-sm border-l-8 border-blue-200';
                ideaCard.innerHTML = `
                    <div class="idea-title font-semibold text-gray-900 text-lg mb-2">${idea.idea}</div>
                    <div class="idea-description text-gray-700 text-base mb-4">${idea.description}</div>
                    ${collapsible('Idea Assessment', null, `assessment-${uuid}`, `
                        ${badge('Feasibility', badgeStyles.feasibility.icon, idea.feasibility_score, badgeStyles.feasibility, idea.feasibility_rationale)}
                        ${badge('Novelty', badgeStyles.novelty.icon, idea.novelty_score, badgeStyles.novelty, idea.novelty_rationale)}
                        ${badge('Impact', badgeStyles.impact.icon, idea.potential_impact_score, badgeStyles.impact, idea.potential_impact_rationale)}
                    `)}
                    ${collapsible('Key Assumptions', idea.key_assumptions, `assumptions-${uuid}`)}
                    ${collapsible('Next Steps', idea.key_next_steps_to_validate_or_develop, `nextsteps-${uuid}`)}
                    ${collapsible('Challenges', idea.major_challenges_roadblocks, `challenges-${uuid}`)}
                `;
                container.appendChild(ideaCard);
            });
            // Collapsible logic
            container.querySelectorAll('.collapse-toggle').forEach(btn => {
                btn.addEventListener('click', function() {
                    const targetId = btn.getAttribute('data-target');
                    const content = document.getElementById(targetId);
                    if (content) {
                        const open = !content.classList.contains('hidden');
                        content.classList.toggle('hidden', open);
                        btn.querySelector('i').classList.toggle('fa-chevron-right', open);
                        btn.querySelector('i').classList.toggle('fa-chevron-down', !open);
                    }
                });
            });
            // Export button logic
            if (exportBtn) {
                exportBtn.onclick = function() {
                    // Gather lens info
                    const lensData = {
                        uuid: lens.uuid,
                        name: lens.name,
                        description: lens.description,
                        idea_spark_uuids: uniqueUuids,
                        idea_sparks: uniqueUuids.map(uuid => idea_lenses_hierarchy.idea_spark_lookup[uuid])
                    };
                    const json = JSON.stringify(lensData, null, 2);
                    const blob = new Blob([json], {type: 'application/json'});
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    const safeName = (lens.name || 'lens').replace(/[^a-z0-9]+/gi, '_').toLowerCase();
                    a.download = `lens_export_${safeName}.json`;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => {
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    }, 100);
                };
            }
            if (clipboardBtn) {
                clipboardBtn.onclick = async function() {
                    const lensData = {
                        uuid: lens.uuid,
                        name: lens.name,
                        description: lens.description,
                        idea_spark_uuids: uniqueUuids,
                        idea_sparks: uniqueUuids.map(uuid => idea_lenses_hierarchy.idea_spark_lookup[uuid])
                    };
                    const json = JSON.stringify(lensData, null, 2);
                    try {
                        await navigator.clipboard.writeText(json);
                        if (clipboardTooltip) {
                            clipboardTooltip.style.opacity = '1';
                            setTimeout(() => { clipboardTooltip.style.opacity = '0'; }, 1200);
                        }
                    } catch (err) {
                        alert('Failed to copy to clipboard');
                    }
                };
            }
        }
        function renderHierarchy() {
            const container = document.getElementById('hierarchy-tree');
            container.innerHTML = '';
            // Add drag-and-drop for top-level lenses
            let dragSrcIndex = null;
            let topLevelLenses = idea_lenses_hierarchy.taxonomy.slice();
            function renderTopLevel() {
                container.innerHTML = '';
                topLevelLenses.forEach((lens, idx) => {
                    const node = createLensNode(lens);
                    node.setAttribute('draggable', 'true');
                    node.classList.add('draggable-lens');
                    node.addEventListener('dragstart', (e) => {
                        dragSrcIndex = idx;
                        node.classList.add('dragging');
                        e.dataTransfer.effectAllowed = 'move';
                    });
                    node.addEventListener('dragend', () => {
                        node.classList.remove('dragging');
                    });
                    node.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        node.classList.add('drag-over');
                    });
                    node.addEventListener('dragleave', () => {
                        node.classList.remove('drag-over');
                    });
                    node.addEventListener('drop', (e) => {
                        e.preventDefault();
                        node.classList.remove('drag-over');
                        if (dragSrcIndex !== null && dragSrcIndex !== idx) {
                            const moved = topLevelLenses.splice(dragSrcIndex, 1)[0];
                            topLevelLenses.splice(idx, 0, moved);
                            renderTopLevel();
                        }
                    });
                    container.appendChild(node);
                });
            }
            renderTopLevel();
        }
        function filterLenses(query) {
            const searchTerm = query.toLowerCase();
            const nodes = document.querySelectorAll('.lens-node');
            nodes.forEach(node => {
                node.style.display = 'none';
                const content = node.querySelector('.lens-content');
                if (content) content.style.display = 'none';
                const toggleIcon = node.querySelector('.toggle-icon');
                if (toggleIcon) toggleIcon.classList.remove('open');
            });
            nodes.forEach(node => {
                const name = node.querySelector('.lens-name').textContent.toLowerCase();
                const description = node.querySelector('.lens-description').textContent.toLowerCase();
                const matches = name.includes(searchTerm) || description.includes(searchTerm);
                if (matches) {
                    node.style.display = 'block';
                    let parent = node.parentElement;
                    while (parent && parent.classList.contains('lens-children')) {
                        const parentNode = parent.parentElement;
                        parentNode.style.display = 'block';
                        const parentContent = parentNode.querySelector('.lens-content');
                        if (parentContent) parentContent.style.display = 'block';
                        const parentToggle = parentNode.querySelector('.toggle-icon');
                        if (parentToggle) parentToggle.classList.add('open');
                        parent = parent.parentElement;
                    }
                }
            });
            if (!searchTerm) {
                nodes.forEach(node => { node.style.display = 'block'; });
            }
        }
        document.getElementById('active-ingredient-text').textContent = idea_lenses_hierarchy.active_ingredient.active_ingredient_text;
        renderHierarchy();
    </script>
</body>
