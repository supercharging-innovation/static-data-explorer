<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impact × Readiness Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .point {
            transition: all 0.3s ease-in-out;
        }
        .point:hover {
            transform: scale(1.2);
            z-index: 20;
        }
        .modal-backdrop {
            transition: opacity 0.3s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 flex items-center justify-center min-h-screen p-4 sm:p-6 lg:p-8">

    <div class="w-full max-w-6xl mx-auto bg-gray-800 rounded-2xl shadow-2xl p-6 sm:p-8">
        <header class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-bold text-white">Automotive Interior Materials</h1>
            <p class="text-lg text-gray-400 mt-2">Impact × Readiness Quadrant Map</p>
        </header>

        <div class="relative flex flex-col items-center pl-8 sm:pl-12">
            <!-- Y-Axis Label -->
            <p class="absolute -left-12 sm:-left-20 top-1/2 -translate-y-1/2 -rotate-90 font-medium text-gray-400 tracking-wider">Potential Impact →</p>
            <span class="absolute -left-6 sm:-left-8 bottom-0 text-sm text-gray-500">Low</span>
            <span class="absolute -left-6 sm:-left-8 top-0 text-sm text-gray-500">High</span>
            
            <div class="w-full aspect-video sm:aspect-[2/1] relative border-l-2 border-b-2 border-gray-600" id="chart-container">
                <!-- Quadrant Backgrounds -->
                <div class="absolute top-0 left-0 w-1/2 h-1/2 bg-yellow-500 bg-opacity-10"></div> <!-- Top-Left: High Impact / Low Readiness -->
                <div class="absolute top-0 right-0 w-1/2 h-1/2 bg-green-500 bg-opacity-10"></div> <!-- Top-Right: High Impact / High Readiness -->
                <div class="absolute bottom-0 left-0 w-1/2 h-1/2 bg-red-500 bg-opacity-10"></div>   <!-- Bottom-Left: Low Impact / Low Readiness -->
                <div class="absolute bottom-0 right-0 w-1/2 h-1/2 bg-blue-500 bg-opacity-10"></div>  <!-- Bottom-Right: Low Impact / High Readiness -->

                <!-- Quadrant Lines -->
                <div class="absolute top-0 left-1/2 w-px h-full bg-gray-500 -translate-x-1/2"></div> <!-- Vertical Line -->
                <div class="absolute left-0 top-1/2 h-px w-full bg-gray-500 -translate-y-1/2"></div> <!-- Horizontal Line -->

                <!-- Quadrant Labels -->
                <div class="absolute top-2 left-2 text-gray-400 text-xs sm:text-sm p-2 pointer-events-none">
                    <h3 class="font-bold">Explore</h3>
                    <p>(High Impact, Low Readiness)</p>
                </div>
                <div class="absolute top-2 right-2 text-gray-400 text-xs sm:text-sm p-2 text-right pointer-events-none">
                    <h3 class="font-bold">Develop</h3>
                    <p>(High Impact, High Readiness)</p>
                </div>
                <div class="absolute bottom-2 left-2 text-gray-400 text-xs sm:text-sm p-2 pointer-events-none">
                    <h3 class="font-bold">Avoid</h3>
                    <p>(Low Impact, Low Readiness)</p>
                </div>
                 <div class="absolute bottom-2 right-2 text-gray-400 text-xs sm:text-sm p-2 text-right pointer-events-none">
                    <h3 class="font-bold">Leverage</h3>
                    <p>(Low Impact, High Readiness)</p>
                </div>
                
                <!-- Data points will be injected here by JavaScript -->
            </div>

             <!-- X-Axis Labels -->
            <div class="w-full flex justify-between mt-2 text-sm text-gray-500">
                <span>Low</span>
                <span>High</span>
            </div>
            <p class="mt-2 font-medium text-gray-400 tracking-wider">← Technology Readiness</p>
        </div>
    </div>

    <!-- Modal for details -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-70 modal-backdrop flex items-center justify-center p-4 hidden z-50 opacity-0">
        <div id="modal-content" class="bg-gray-800 rounded-2xl shadow-xl w-full max-w-lg p-8 transform transition-transform duration-300 scale-95">
            <h2 id="modal-title" class="text-2xl font-bold text-white mb-2"></h2>
            <p id="modal-category" class="text-sm font-semibold text-cyan-400 uppercase tracking-wider mb-4"></p>
            <p id="modal-description" class="text-gray-300 mb-6"></p>
            <div id="modal-links" class="border-t border-gray-700 pt-4">
                <h3 class="text-md font-semibold text-gray-400 mb-3">Sources:</h3>
                <!-- Links will be injected here -->
            </div>
            <button id="close-modal" class="absolute top-4 right-4 text-gray-500 hover:text-white transition-colors" title="Close modal">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        // --- DATA ---
        // Data for the points on the chart.
        // Impact and Readiness are on a scale of 0 to 10.
        // The chart is divided at 5 on both axes.
        const technologies = [
            {
                name: "Cellulose or BNC aerogel pads",
                category: "High impact / Medium readiness",
                description: "With hydrophobized surfaces & protective scrims, used behind headliners/doors. Strong physics and far-domain proof; needs automotive-specific durability, flame, VOC, and humidity cycling evidence.",
                impact: 9, 
                readiness: 5.5, // TRL 3-4, just over the line into "Develop"
                color: 'bg-green-500',
                links: [
                    { name: "Nature", url: "https://www.nature.com/articles/s41560-023-01226-7?utm_source=chatgpt.com" },
                    { name: "PubMed", url: "https://pubmed.ncbi.nlm.nih.gov/30768255/?utm_source=chatgpt.com" }
                ]
            },
            {
                name: "Knittable aerogel fiber laminates",
                category: "High impact / Lower readiness",
                description: "For seat comfort layers (breathable warmth + acoustic damping). Apparel evidence is strong; auto wear/cleaner/UV specs still to prove.",
                impact: 8,
                readiness: 3,
                color: 'bg-yellow-500',
                links: [
                    { name: "Science", url: "https://www.science.org/doi/10.1126/science.adj8013?utm_source=chatgpt.com" }
                ]
            },
            {
                name: "PET/cotton felts, melamine foams",
                category: "Benchmark (Today’s state)",
                description: "Production-ready, lower sustainability upside vs. bio-aerogels.",
                impact: 4,
                readiness: 9.5,
                color: 'bg-blue-500',
                links: [
                    { name: "Autoneum", url: "https://www.autoneum.com/2021/11/15/flexi-loft-versatile-sustainability-champion-with-high-acoustic-performance/?utm_source=chatgpt.com" },
                    { name: "BASF", url: "https://www.basotect.basf.com/?utm_source=chatgpt.com" }
                ]
            }
        ];

        // --- DOM ELEMENTS ---
        const chartContainer = document.getElementById('chart-container');
        const modal = document.getElementById('modal');
        const modalContent = document.getElementById('modal-content');
        const closeModalBtn = document.getElementById('close-modal');

        // --- FUNCTIONS ---

        /**
         * Creates and places a data point on the chart.
         * @param {object} tech - The technology data object.
         */
        function createPoint(tech) {
            const point = document.createElement('div');
            point.className = `point absolute w-10 h-10 -translate-x-1/2 -translate-y-1/2 rounded-full cursor-pointer flex items-center justify-center shadow-lg ring-4 ring-gray-900 z-10`;
            point.classList.add(tech.color);

            // Position based on readiness (x) and impact (y)
            point.style.left = `${tech.readiness * 10}%`;
            point.style.bottom = `${tech.impact * 10}%`;
            
            // Add a label inside the point
            const label = document.createElement('span');
            label.className = 'text-xs font-bold text-white text-center leading-tight p-1';
            label.textContent = tech.name.split(' ')[0]; // Use first word as label
            point.appendChild(label);

            point.addEventListener('click', () => showModal(tech));
            chartContainer.appendChild(point);
        }

        /**
         * Displays the modal with details for a given technology.
         * @param {object} tech - The technology data object.
         */
        function showModal(tech) {
            document.getElementById('modal-title').textContent = tech.name;
            document.getElementById('modal-category').textContent = tech.category;
            document.getElementById('modal-description').textContent = tech.description;

            const linksContainer = document.getElementById('modal-links');
            linksContainer.innerHTML = '<h3 class="text-md font-semibold text-gray-400 mb-3">Sources:</h3>'; // Reset links
            
            tech.links.forEach(link => {
                const a = document.createElement('a');
                a.href = link.url;
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                a.className = 'flex items-center text-blue-400 hover:text-blue-300 mb-2 transition-colors group';
                a.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                    </svg>
                    <span class="group-hover:underline">${link.name}</span>
                `;
                linksContainer.appendChild(a);
            });

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
            }, 10); // Start transition after display is set
        }

        /**
         * Hides the modal.
         */
        function hideModal() {
            modal.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300); // Wait for transition to finish
        }

        // --- INITIALIZATION ---

        // Populate the chart with data points
        technologies.forEach(createPoint);

        // --- EVENT LISTENERS ---
        closeModalBtn.addEventListener('click', hideModal);
        modal.addEventListener('click', (e) => {
            // Close if clicking on the backdrop
            if (e.target === modal) {
                hideModal();
            }
        });
        
        // Close modal with Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !modal.classList.contains('hidden')) {
                hideModal();
            }
        });

    </script>
</body>
</html>
