<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Analogical Scenarios Explorer</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&family=Avenir:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --primary-color: #7c3aed;
      --secondary-color: #5b21b6;
      --background-color: #f5f3ff;
      --card-background: #ffffff;
      --text-primary: #1e1b4b;
      --text-secondary: #4c1d95;
      --border-color: #e9d8fd;
      --hover-color: #f3e8ff;
      --shadow-sm: 0 1px 2px 0 rgb(124, 58, 237, 0.05);
      --shadow-md: 0 4px 6px -1px rgb(124, 58, 237, 0.1);
      --radius-sm: 0.375rem;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: "Avenir", sans-serif;
      background-color: var(--background-color);
      color: var(--text-primary);
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .view-container {
      position: relative;
      height: 100vh;
      overflow: hidden;
    }

    .problem-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--card-background);
      display: flex;
      flex-direction: column;
      padding: 1rem;
      transition: transform 0.3s ease;
      overflow-y: auto;
    }

    .problem-view.hidden {
      transform: translateX(-100%);
    }

    .problem-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border-color);
    }

    .problem-header h1 {
      color: var(--primary-color);
      font-size: 1.75rem;
      margin: 0;
    }

    .prompts-link {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: var(--radius-md);
      background-color: var(--background-color);
      transition: all 0.2s ease;
    }

    .prompts-link:hover {
      background-color: var(--hover-color);
      transform: translateY(-1px);
    }

    .problem-content {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 0 1rem;
    }

    .problem-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      flex: 1;
    }

    .problem-column {
      background-color: var(--card-background);
      padding: 0.75rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      height: fit-content;
    }

    .problem-column h2 {
      color: var(--primary-color);
      margin-bottom: 0.5rem;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .problem-column h3 {
      color: var(--text-primary);
      margin: 0.5rem 0 0.25rem;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .problem-column p {
      color: var(--text-secondary);
      line-height: 1.4;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    .problem-column p:last-child {
      margin-bottom: 0;
    }

    .problem-selector {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .problem-selector label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .top-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-color);
    }

    .problem-dropdown-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex: 1;
      margin-right: 1rem;
    }

    .problem-dropdown {
      flex: 1;
      padding: 0.5rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-family: "Avenir", sans-serif;
      background-color: var(--card-background);
      transition: all 0.2s;
      color: var(--text-primary);
      max-width: 400px;
    }

    .problem-dropdown:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
    }

    .explore-button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 0.6rem 1.5rem;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .explore-button:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .explore-button svg {
      width: 18px;
      height: 18px;
    }

    .scenarios-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--background-color);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease;
    }

    .scenarios-view.hidden {
      transform: translateX(100%);
    }

    .back-button {
      position: fixed;
      bottom: 2rem; /* Changed from top to bottom */
      right: 2rem;
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 0.75rem;
      border-radius: var(--radius-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: var(--shadow-md);
      transition: all 0.2s ease;
      z-index: 1000;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .back-button:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .back-button svg {
      width: 20px;
      height: 20px;
    }

    /* Remove the old expand/collapse styles */
    .back-button span {
      display: inline;
    }

    .app-container {
      display: grid;
      grid-template-columns: 300px 300px 300px 1fr;
      flex: 1;
      min-height: 0;
      background-color: var(--background-color);
      overflow: hidden;
    }

    .column {
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      background-color: var(--card-background);
      overflow: hidden;
    }

    .column-header {
      padding: 1rem;
      background-color: var(--card-background);
      border-bottom: 1px solid var(--border-color);
      font-weight: 600;
      color: var(--text-primary);
      font-size: 1.1rem;
      letter-spacing: -0.025em;
      font-family: "Raleway", sans-serif;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-shrink: 0;
    }

    .column-header .badge {
      background-color: var(--primary-color);
      color: white;
      padding: 0.25rem 0.5rem;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      font-weight: 500;
    }

    .search-container {
      padding: 0.75rem;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--card-background);
      flex-shrink: 0;
    }

    .search-input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      transition: all 0.2s;
      background-color: var(--card-background);
      font-family: "Avenir", sans-serif;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
    }

    .domain-item,
    .category-item,
    .scenario-item {
      padding: 0.875rem;
      margin-bottom: 0.75rem; /* Increased margin between items */
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.2s ease;
      background-color: var(--card-background);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }

    .domain-item:hover,
    .category-item:hover,
    .scenario-item:hover {
      background-color: var(--hover-color);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .domain-item.selected,
    .category-item.selected,
    .scenario-item.selected {
      background-color: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
      box-shadow: 0 4px 6px -1px rgba(124, 58, 237, 0.2);
    }

    .domain-item.selected h3,
    .category-item.selected h3,
    .scenario-item.selected h3 {
      color: white;
    }

    .domain-item.selected p,
    .category-item.selected p,
    .scenario-item.selected p {
      color: rgba(255, 255, 255, 0.9);
    }

    .domain-item h3,
    .category-item h3,
    .scenario-item h3 {
      font-size: 1rem;
      margin-bottom: 0.375rem;
      color: var(--primary-color);
      font-weight: 600;
      letter-spacing: -0.025em;
      font-family: "Raleway", sans-serif;
    }

    .domain-item p,
    .category-item p,
    .scenario-item p {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin: 0;
      line-height: 1.5;
    }

    .scenario-details {
      padding: 1rem;
      padding-bottom: 2rem;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--primary-color) var(--background-color);
    }

    .scenario-details::-webkit-scrollbar {
      width: 6px;
    }

    .scenario-details::-webkit-scrollbar-track {
      background: var(--background-color);
    }

    .scenario-details::-webkit-scrollbar-thumb {
      background-color: var(--primary-color);
      border-radius: 3px;
    }

    .active-ingredients,
    .overall-synthesis {
      background: var(--background-color);
      padding: 1rem;
      border-radius: var(--radius-lg);
      margin: 1rem 0;
      margin-bottom: 1.5rem; /* Add more space between sections */
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
    }

    .active-ingredients ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .active-ingredients li {
      margin-bottom: 0.75rem;
      padding-left: 1.5rem;
      position: relative;
    }

    .active-ingredients li:before {
      content: "•";
      color: var(--primary-color);
      position: absolute;
      left: 0;
      font-weight: bold;
    }

    .active-ingredients strong {
      color: var(--primary-color);
      font-weight: 600;
    }

    .citation {
      color: var(--primary-color);
      text-decoration: none;
      font-size: 0.85rem;
      vertical-align: baseline;
      line-height: 1;
      padding: 0.1em 0.3em;
      border-radius: 0.2em;
      transition: all 0.2s;
    }

    .citation:hover {
      background-color: rgba(124, 58, 237, 0.1);
      text-decoration: none;
    }

    .domain-item.selected .citation,
    .category-item.selected .citation,
    .scenario-item.selected .citation {
      color: rgba(255, 255, 255, 0.9);
    }

    .domain-item.selected .citation:hover,
    .category-item.selected .citation:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }

    .ingredients-content {
      white-space: pre-line;
      font-family: inherit;
      line-height: 1.5;
    }

    .ingredients-content strong {
      color: var(--primary-color);
      font-weight: 600;
    }

    .column-content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 0.75rem;
      scrollbar-width: thin;
      scrollbar-color: var(--primary-color) var(--background-color);
    }

    .column-content::-webkit-scrollbar {
      width: 6px;
    }

    .column-content::-webkit-scrollbar-track {
      background: var(--background-color);
    }

    .column-content::-webkit-scrollbar-thumb {
      background-color: var(--primary-color);
      border-radius: 3px;
    }

    /* Add extra spacing at the bottom of scrollable content */
    .domain-item:last-child,
    .category-item:last-child,
    .scenario-item:last-child {
      margin-bottom: 3rem;
    }

    /* Also add bottom padding to the scenario details content */
    #scenarioDetails .scenario-details {
      margin-bottom: 3rem;
    }

    /* Render the scenario details properly */
    .scenario-details h2 {
      color: var(--primary-color);
      margin-bottom: 1rem;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.025em;
      font-family: "Raleway", sans-serif;
    }

    .scenario-details h3 {
      color: var(--text-primary);
      margin: 0.75rem 0 0.75rem;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.025em;
      font-family: "Raleway", sans-serif;
    }

    .scenario-details p {
      margin-bottom: 1rem;
      line-height: 1.7;
      color: var(--text-primary);
    }

    @media (max-width: 1400px) {
      .app-container {
        grid-template-columns: 280px 280px 280px 1fr;
      }
    }

    @media (max-width: 1200px) {
      .app-container {
        grid-template-columns: 250px 250px 250px 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="main-container">
    <div class="view-container">
      <!-- Problem View -->
      <div class="problem-view" id="problemView">
        <div class="problem-header">
          <h1>Analogical Scenarios Explorer</h1>
          <a href="prompts.html" class="prompts-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
            </svg>
            View Prompts
          </a>
        </div>

        <div class="problem-content">
          <div class="top-controls">
            <div class="problem-dropdown-container">
              <label for="problemDropdown">Choose Problem:</label>
              <select id="problemDropdown" class="problem-dropdown" onchange="handleProblemChange()">
                <option value="">--Select--</option>
              </select>
            </div>

            <button class="explore-button" onclick="toggleViews()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 18l6-6-6-6"/>
              </svg>
              Explore Analogical Scenarios
            </button>
          </div>

          <div class="problem-grid">
            <div class="problem-column">
              <h2>Design Problem</h2>
              <p id="problemText"></p>
            </div>

            <div class="problem-column">
              <h2>Problem Abstraction</h2>
              <p id="abstractionSummary"></p>
            </div>

            <div class="problem-column">
              <h2>Key Elements</h2>
              <h3>Key Entities</h3>
              <p id="keyEntities"></p>
              <h3>System Constraints</h3>
              <p id="systemConstraints"></p>
            </div>

            <div class="problem-column">
              <h2>Original Problem Domain</h2>
              <p id="originalDomain"></p>
              <h2>Notes</h2>
              <p id="problemNotes"></p>
            </div>
          </div>
        </div>
      </div>

      <!-- Scenarios View -->
      <div class="scenarios-view hidden" id="scenariosView">
        <button class="back-button" onclick="toggleViews()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
          Back to Problem
        </button>

        <div class="app-container">
          <!-- DOMAINS -->
          <div class="column">
            <div class="column-header">
              Domains
              <span class="badge" id="domainCount">0</span>
            </div>
            <div class="search-container">
              <input
                type="text"
                class="search-input"
                placeholder="Search domains..."
                id="domainSearch"
              />
            </div>
            <div class="column-content" id="domainsList"></div>
          </div>

          <!-- CATEGORIES -->
          <div class="column">
            <div class="column-header">
              Categories
              <span class="badge" id="categoryCount">0</span>
            </div>
            <div class="search-container">
              <input
                type="text"
                class="search-input"
                placeholder="Search categories..."
                id="categorySearch"
              />
            </div>
            <div class="column-content" id="categoriesList"></div>
          </div>

          <!-- SCENARIOS -->
          <div class="column">
            <div class="column-header">
              Scenarios
              <span class="badge" id="scenarioCount">0</span>
            </div>
            <div class="search-container">
              <input
                type="text"
                class="search-input"
                placeholder="Search scenarios..."
                id="scenarioSearch"
              />
            </div>
            <div class="column-content" id="scenariosList"></div>
          </div>

          <!-- SCENARIO DETAILS -->
          <div class="column">
            <div class="column-header">Scenario Details</div>
            <div class="column-content" id="scenarioDetails"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Load external data files -->
  <script src="problem.js"></script>
  <script src="data/data_problem_1.js"></script>

  <!-- Main logic -->
  <script>
    let data = null; // whichever problem's data is currently selected
    let selectedDomain = null;
    let selectedCategory = null;
    let selectedScenario = null;

    // On load, populate the problem dropdown and set default selection
    window.addEventListener("DOMContentLoaded", () => {
      const problemDropdown = document.getElementById("problemDropdown");
      // Add options from problemsData
      for (const [key, value] of Object.entries(problemsData)) {
        const option = document.createElement("option");
        option.value = key; // "problem_1" or "problem_2"
        option.textContent = value.title;
        problemDropdown.appendChild(option);
      }
      
      // Set default selection to first problem
      if (Object.keys(problemsData).length > 0) {
        const firstProblemKey = Object.keys(problemsData)[0];
        problemDropdown.value = firstProblemKey;
        handleProblemChange(); // Trigger the change to load initial data
      }
    });

    function clearUI() {
      // Clear context section
      document.getElementById("problemText").textContent = "";
      document.getElementById("abstractionSummary").textContent = "";
      document.getElementById("keyEntities").textContent = "";
      document.getElementById("systemConstraints").textContent = "";
      
      // Clear all columns
      document.getElementById("domainsList").innerHTML = "";
      document.getElementById("categoriesList").innerHTML = "";
      document.getElementById("scenariosList").innerHTML = "";
      document.getElementById("scenarioDetails").innerHTML = "";
      
      // Reset counts
      document.getElementById("domainCount").textContent = "0";
      document.getElementById("categoryCount").textContent = "0";
      document.getElementById("scenarioCount").textContent = "0";
      
      // Reset search inputs
      document.getElementById("domainSearch").value = "";
      document.getElementById("categorySearch").value = "";
      document.getElementById("scenarioSearch").value = "";
    }

    function handleProblemChange() {
      const problemKey = document.getElementById("problemDropdown").value;
      if (!problemKey) {
        data = null;
        clearUI();
        return;
      }
      // Load the chosen data
      if (problemKey === "problem_1") {
        data = analogicalData_problem_1;
      } else if (problemKey === "problem_2") {
        data = analogicalData_problem_2;
      }
      // Reset selections
      selectedDomain = null;
      selectedCategory = null;
      selectedScenario = null;
      clearUI(); // Clear UI first
      initialize(); // Then initialize with new data
    }

    function initialize() {
      if (!data) return;

      // Populate context section with formatted text
      document.getElementById("problemText").innerHTML = 
        formatMarkdown(data.problem.problem_text);
      document.getElementById("abstractionSummary").innerHTML = 
        formatMarkdown(data.problem_abstraction.text_summary);
      document.getElementById("keyEntities").innerHTML = 
        formatMarkdown(data.problem_abstraction.key_entities);
      document.getElementById("systemConstraints").innerHTML = 
        formatMarkdown(data.problem_abstraction.system_constraints);
      document.getElementById("originalDomain").innerHTML = 
        formatMarkdown(data.problem.original_problem_domain);
      document.getElementById("problemNotes").innerHTML = 
        formatMarkdown(data.problem.notes);

      // Filter domains with an empty search
      filterDomains("");
      setupEventListeners();
    }

    function setupEventListeners() {
      document
        .getElementById("domainSearch")
        .addEventListener("input", (e) => filterDomains(e.target.value));
      document
        .getElementById("categorySearch")
        .addEventListener("input", (e) => filterCategories(e.target.value));
      document
        .getElementById("scenarioSearch")
        .addEventListener("input", (e) => filterScenarios(e.target.value));
    }

    // Convert citations like [1,2] to clickable links
    function processCitations(text, sources) {
      if (!text || !sources) return text;
      return text.replace(/\[(\d+(?:,\s*\d+)*)\]/g, (match, numbers) => {
        const citationNumbers = numbers.split(",").map((n) => n.trim());
        return citationNumbers
          .map((num) => {
            const source = sources.find(
              (s) => s.citation_number === parseInt(num, 10)
            );
            if (source) {
              return `<a href="${source.url}" class="citation" target="_blank">[${num}]</a>`;
            }
            return `[${num}]`;
          })
          .join(", ");
      });
    }

    // Domains
    function filterDomains(searchTerm) {
      if (!data) return;
      const domainsList = document.getElementById("domainsList");
      const filteredDomains = data.domains.filter(
        (domain) =>
          domain.domain_name.toLowerCase().includes(searchTerm.toLowerCase()) ||
          domain.domain_rationale
            .toLowerCase()
            .includes(searchTerm.toLowerCase())
      );
      document.getElementById("domainCount").textContent = filteredDomains.length;
      domainsList.innerHTML = filteredDomains
        .map(
          (domain) => `
            <div
              class="domain-item ${
                selectedDomain === domain.domain_name ? "selected" : ""
              }"
              onclick="selectDomain('${domain.domain_name}')"
            >
              <h3>${domain.domain_name}</h3>
              <p>${domain.domain_rationale}</p>
            </div>
          `
        )
        .join("");
    }

    function selectDomain(domainName) {
      selectedDomain = domainName;
      selectedCategory = null;
      selectedScenario = null;
      filterDomains(document.getElementById("domainSearch").value);
      filterCategories("");
      document.getElementById("scenariosList").innerHTML = "";
      document.getElementById("scenarioDetails").innerHTML = "";
    }

    // Categories
    function filterCategories(searchTerm) {
      if (!data || !selectedDomain) {
        document.getElementById("categoriesList").innerHTML = "";
        document.getElementById("categoryCount").textContent = "0";
        return;
      }
      const categoriesList = document.getElementById("categoriesList");
      const domain = data.domains.find(
        (d) => d.domain_name === selectedDomain
      );
      if (!domain) return;

      const filteredCategories = domain.categories.filter(
        (category) =>
          category.category_name
            .toLowerCase()
            .includes(searchTerm.toLowerCase()) ||
          category.category_overview
            .toLowerCase()
            .includes(searchTerm.toLowerCase())
      );

      document.getElementById("categoryCount").textContent =
        filteredCategories.length;

      categoriesList.innerHTML = filteredCategories
        .map(
          (category) => `
            <div
              class="category-item ${
                selectedCategory === category.category_name ? "selected" : ""
              }"
              onclick="selectCategory('${category.category_name}')"
            >
              <h3>${category.category_name}</h3>
              <p>${category.category_overview}</p>
            </div>
          `
        )
        .join("");
    }

    function selectCategory(categoryName) {
      selectedCategory = categoryName;
      selectedScenario = null;
      filterCategories(document.getElementById("categorySearch").value);
      filterScenarios("");
      document.getElementById("scenarioDetails").innerHTML = "";
    }

    // Scenarios
    function filterScenarios(searchTerm) {
      if (!data || !selectedDomain || !selectedCategory) {
        document.getElementById("scenariosList").innerHTML = "";
        document.getElementById("scenarioCount").textContent = "0";
        return;
      }
      const scenariosList = document.getElementById("scenariosList");
      const domain = data.domains.find((d) => d.domain_name === selectedDomain);
      const category = domain.categories.find(
        (c) => c.category_name === selectedCategory
      );
      if (!category) return;

      const filteredScenarios = category.scenarios.filter((scenario) =>
        scenario.scenario_name.toLowerCase().includes(searchTerm.toLowerCase())
      );

      document.getElementById("scenarioCount").textContent =
        filteredScenarios.length;

      scenariosList.innerHTML = filteredScenarios
        .map(
          (scenario) => `
            <div
              class="scenario-item ${
                selectedScenario === scenario.scenario_name ? "selected" : ""
              }"
              onclick="selectScenario('${scenario.scenario_name}')"
            >
              <h3>${scenario.scenario_name}</h3>
              <p>${scenario.scenario_description}</p>
            </div>
          `
        )
        .join("");
    }

    function selectScenario(scenarioName) {
      selectedScenario = scenarioName;
      filterScenarios(document.getElementById("scenarioSearch").value);
      renderScenarioDetails(selectedDomain, selectedCategory, scenarioName);
    }

    // Scenario Details
    function renderScenarioDetails(domainName, categoryName, scenarioName) {
      if (!data) return;
      const scenarioDetailsDiv = document.getElementById("scenarioDetails");

      const domain = data.domains.find((d) => d.domain_name === domainName);
      const category = domain.categories.find(
        (c) => c.category_name === categoryName
      );
      const scenario = category.scenarios.find(
        (s) => s.scenario_name === scenarioName
      );
      if (!scenario) return;

      const searchResults = scenario.search_results;

      // Process active ingredients with citations and markdown
      const activeIngredients = searchResults.active_ingredients
        .map((ingredient) => {
          const support = searchResults.grounding_support.find(s => 
            s.segment.text.includes(ingredient)
          );
          
          if (support) {
            const citations = support.grounding_chunk_indices.map(index => {
              const citation = searchResults.grounded_citations.find(c => c.number === index);
              return citation ? `<a href="${citation.url}" class="citation" target="_blank">[${citation.number}]</a>` : '';
            }).filter(Boolean).join(', ');
            
            return `<li>${formatMarkdown(ingredient)} ${citations}</li>`;
          }
          return `<li>${formatMarkdown(ingredient)}</li>`;
        })
        .join('');

      scenarioDetailsDiv.innerHTML = `
        <div class="scenario-details">
          <h2>${scenario.scenario_name}</h2>
          <p>${formatMarkdown(searchResults.scenario_description)}</p>
          
          <div class="active-ingredients">
            <h3>Active Ingredients</h3>
            <ul class="markdown-list">${activeIngredients}</ul>
          </div>
          
          <div class="overall-synthesis">
            <h3>Structural Alignment</h3>
            <p>${formatMarkdown(searchResults.alignment_with_structure)}</p>
            
            <h3>Design Problem Connection</h3>
            <p>${formatMarkdown(searchResults.design_problem_connection)}</p>
          </div>

          <div class="references-section">
            <h3>References</h3>
            ${searchResults.grounded_citations
              .map(citation => `
                <div class="reference-item">
                  <a href="${citation.url}" target="_blank">[${citation.number}] ${citation.title}</a>
                </div>
              `)
              .join('')}
          </div>
          
          <div style="height: 30px;"></div>
        </div>
      `;
    }

    function toggleViews() {
      const problemView = document.getElementById('problemView');
      const scenariosView = document.getElementById('scenariosView');
      
      problemView.classList.toggle('hidden');
      scenariosView.classList.toggle('hidden');
    }

    function formatMarkdown(text) {
      if (!text) return '';
      
      // Replace **text** with <strong>text</strong>
      text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      
      // Handle bullet points - look for "* text" pattern
      // Split by newlines, process each line, then rejoin
      const lines = text.split('\n');
      const formattedLines = lines.map(line => {
        const trimmed = line.trim();
        if (trimmed.startsWith('* ')) {
          return `<li>${trimmed.substring(2)}</li>`;
        }
        return `<p>${line}</p>`;
      });
      
      // If we have any bullet points, wrap them in a ul
      let inList = false;
      let result = '';
      
      formattedLines.forEach(line => {
        if (line.startsWith('<li>') && !inList) {
          result += '<ul class="markdown-list">';
          inList = true;
        } else if (!line.startsWith('<li>') && inList) {
          result += '</ul>';
          inList = false;
        }
        result += line;
      });
      
      if (inList) {
        result += '</ul>';
      }
      
      return result;
    }
  </script>
</body>
